# ==============================================================================
# Cluster Chat - Domestic Iranian Relay Nginx Reverse Proxy Configuration
# National Internet (نت ملی) Forwarder
# ==============================================================================
# Deployed on an Iranian domestic VPS / server that has domestic intranet access
# and outbound connectivity to the foreign VPS IP:port.
# Forwards client traffic seamlessly to foreign VPS Cluster Chat instance.
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream pointing to foreign VPS IP:port
# REPLACE 203.0.113.10:8080 with your foreign VPS IP and port
upstream foreign_cluster_chat_vps {
    server 203.0.113.10:8080;  # REPLACE WITH YOUR FOREIGN VPS IP:PORT
    keepalive 32;
}

# ------------------------------------------------------------------------------
# Layer-7 Reverse Proxy Server Block
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;

    # Host-agnostic: match any domestic IP, domain, or hostname
    server_name _;

    client_max_body_size 50M;
    client_body_buffer_size 1M;

    # Timeouts for long-lived streams and polling
    proxy_connect_timeout 30s;
    proxy_send_timeout    86400s;
    proxy_read_timeout    86400s;
    send_timeout          86400s;

    # Reverse proxy header forwarding
    # Preserves incoming Host (domestic IP:port or relay host) so client stays bound
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket Upgrade
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Pass all traffic to foreign cluster-chat
    location / {
        proxy_pass http://foreign_cluster_chat_vps;
        proxy_redirect off;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Static UI Assets
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        proxy_pass http://foreign_cluster_chat_vps;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Server-Sent Events (SSE) Unbuffered Stream
    location ~* ^/(?:api/cluster-chat/events|api/events|events) {
        proxy_pass http://foreign_cluster_chat_vps;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        add_header Content-Type "text/event-stream" always;
        add_header Cache-Control "no-cache, no-transform" always;
        add_header X-Accel-Buffering "no" always;
    }

    # WebSocket endpoint (/ws)
    location ~* ^/(?:ws|api/cluster-chat/ws) {
        proxy_pass http://foreign_cluster_chat_vps;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # File Uploads (50MB)
    location ~* ^/(?:api/cluster-chat/upload|api/upload|api/rooms/[^/]+/upload) {
        proxy_pass http://foreign_cluster_chat_vps;
        client_max_body_size 50M;
        client_body_buffer_size 1M;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Attachment Downloads
    location ~* ^/(?:api/cluster-chat/files|api/files|files|uploads|api/uploads|api/attachments|attachments)/ {
        proxy_pass http://foreign_cluster_chat_vps;
        client_max_body_size 50M;
        proxy_buffering on;
        proxy_buffers 8 64k;
        proxy_read_timeout 120s;
    }

    # Health & Ping
    location ~* ^/(?:api/health|api/ping|api/cluster-chat/health|api/cluster-chat/ping)$ {
        proxy_pass http://foreign_cluster_chat_vps;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

