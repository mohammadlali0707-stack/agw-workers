# ==============================================================================
# Cluster Chat - Host-Agnostic Direct-IP Nginx Configuration
# VPN-Free & National Internet (نت ملی) Resilient Serving
# ==============================================================================
# Listens on raw VPS IP:port without domain redirects or fixed domain dependencies.
# Eliminates all reliance on legacy or filtered external domains.
# Supports HTTP (port 80 / 8080) and optional HTTPS (port 443 / 8443).
# Fully host-agnostic: server_name _;
# 50MB file uploads, WebSocket upgrade, SSE streaming unbuffered.
# ==============================================================================

# Map WebSocket upgrade headers (active when included in http context)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream pointing to Cluster Chat Python backend server
upstream cluster_chat_direct_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. Host-Agnostic HTTP Server Block (Direct IP / Port 80 or 8080)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;

    # Catch-all server name matching raw IP and any Host header
    server_name _;

    # Maximum file upload size: 50MB
    client_max_body_size 50M;
    client_body_buffer_size 1M;

    # Timeouts for long-lived realtime connections
    proxy_connect_timeout 60s;
    proxy_send_timeout    86400s;
    proxy_read_timeout    86400s;
    send_timeout          86400s;

    # Host-Agnostic Reverse Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket Upgrade Headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Main Web UI and API Endpoints
    location / {
        proxy_pass http://cluster_chat_direct_backend;
        proxy_redirect off;

        # Disable cache on dynamic chat traffic
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Static Web UI Assets (caching allowed for assets)
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        proxy_pass http://cluster_chat_direct_backend;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Server-Sent Events (SSE) Unbuffered Stream
    location ~* ^/(?:api/cluster-chat/events|api/events|events) {
        proxy_pass http://cluster_chat_direct_backend;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        add_header Content-Type "text/event-stream" always;
        add_header Cache-Control "no-cache, no-transform" always;
        add_header X-Accel-Buffering "no" always;
    }

    # WebSocket Realtime Stream (/ws)
    location ~* ^/(?:ws|api/cluster-chat/ws) {
        proxy_pass http://cluster_chat_direct_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Multipart File & Photo Uploads (/api/cluster-chat/upload, /api/upload)
    location ~* ^/(?:api/cluster-chat/upload|api/upload|api/rooms/[^/]+/upload) {
        proxy_pass http://cluster_chat_direct_backend;
        client_max_body_size 50M;
        client_body_buffer_size 1M;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Attachment & File Downloads (/api/cluster-chat/files/..., /uploads/...)
    location ~* ^/(?:api/cluster-chat/files|api/files|files|uploads|api/uploads|api/attachments|attachments)/ {
        proxy_pass http://cluster_chat_direct_backend;
        client_max_body_size 50M;
        proxy_buffering on;
        proxy_buffers 8 64k;
        proxy_read_timeout 120s;
    }

    # Health & Transport Probes
    location ~* ^/(?:api/health|api/ping|api/cluster-chat/health|api/cluster-chat/ping)$ {
        proxy_pass http://cluster_chat_direct_backend;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

