version: "2.0"
registry_name: "telegram_lead_sources"
description: >
  Production Telegram channel registry with rigorous deprioritization rules,
  adjusted polling intervals, reduced fetch frequencies, and explicit dormant/inactive
  marking for confirmed dead channels to eliminate wasted runner and parser cycles.

# ------------------------------------------------------------------------------
# Scheduling Policies & Tier Architecture
# ------------------------------------------------------------------------------
policies:
  tier_1:
    priority_level: 1
    tier_name: "Golden High-Priority"
    description: "High-yield commercial channels with low noise and verified project budgets"
    polling_interval_minutes: 15
    fetch_frequency_daily: 96
    immediate_webhook: true
    batch_mode: false
    token_budget_ratio: 1.0
    keyword_filter_strict: false
    operational_status: "active"

  tier_2:
    priority_level: 2
    tier_name: "Standard Priority"
    description: "Selective corporate channels and moderated specialized developer communities"
    polling_interval_minutes: 60
    fetch_frequency_daily: 24
    immediate_webhook: false
    batch_mode: true
    batch_window_minutes: 30
    token_budget_ratio: 0.8
    keyword_filter_strict: false
    operational_status: "active"

  tier_3:
    priority_level: 3
    tier_name: "Deprioritized / Low Cadence"
    description: "High-noise community chat supergroups with low commercial signal and high chatter ratio"
    polling_interval_minutes: 360
    fetch_frequency_daily: 4
    immediate_webhook: false
    batch_mode: true
    batch_window_minutes: 180
    token_budget_ratio: 0.15
    keyword_filter_strict: true
    operational_status: "deprioritized"
    required_keywords:
      - "بودجه"
      - "نیازمند برنامه‌نویس"
      - "پروژه"
      - "طراحی اختصاصی"
      - "استخدام برنامه‌نویس"
      - "همکاری پروژه‌ای"
      - "توسعه‌دهنده"
      - "قراردادی"

  quarantine:
    priority_level: 4
    tier_name: "Quarantined / Muted"
    description: "High-volume ad-spam channels with 0% qualified conversion; muted with high budget barrier"
    polling_interval_minutes: 1440
    fetch_frequency_daily: 1
    mute: true
    immediate_webhook: false
    batch_mode: true
    token_budget_ratio: 0.0
    operational_status: "quarantined"
    min_budget_threshold_toman: 20000000
    require_verified_employer: true

  dormant:
    priority_level: 0
    tier_name: "Dormant / Inactive"
    description: "Confirmed dead channels with continuous zero output (>14d) or unrecoverable MTProto errors"
    polling_interval_minutes: 0
    fetch_frequency_daily: 0
    active: false
    polling_enabled: false
    mtproto_listener_enabled: false
    operational_status: "dormant"
    action: "deregister_and_purge"

