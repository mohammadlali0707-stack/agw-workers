name: notion-bilingual

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  bilingual-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore sync timestamp cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/notion-bilingual
          key: notion-bilingual-state-${{ runner.os }}
          restore-keys: |
            notion-bilingual-state-

      - name: Sync Notion pages (Part 3)
        env:
          NOTION_PAT: ${{ secrets.NOTION_PAT }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: |
          python3 tools/bilingual/notion_fa.py

      - name: Sync Notion databases (Part 4)
        env:
          NOTION_PAT: ${{ secrets.NOTION_PAT }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          STATE_FILE: .cache/notion-bilingual/last_sync.json
        run: |
          python3 tools/bilingual/notion_db.py --since-file "$STATE_FILE"

      - name: Save sync timestamp cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/notion-bilingual
          key: notion-bilingual-state-${{ runner.os }}-${{ github.run_id }}
