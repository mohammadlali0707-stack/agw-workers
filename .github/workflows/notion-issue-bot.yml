name: Notion issue bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  check-marker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    outputs:
      match: ${{ steps.check.outputs.match }}
    steps:
      - name: Check for a trailing @notion marker
        id: check
        env:
          BODY: ${{ github.event.comment.body || github.event.issue.body || '' }}
        run: |
          TRIMMED="$(printf '%s' "$BODY" | sed -e 's/[[:space:]]*$//')"
          case "$TRIMMED" in
            *"@notion") echo "match=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "match=false" >> "$GITHUB_OUTPUT" ;;
          esac

  call-n8n:
    needs: [check-marker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      needs.check-marker.outputs.match == 'true' &&
      (
        (github.event_name == 'issues' &&
          (github.event.issue.author_association == 'OWNER' ||
            github.event.issue.author_association == 'COLLABORATOR' ||
            github.event.issue.user.login == 'Mohammadlali'))
        ||
        (github.event_name == 'issue_comment' &&
          github.event.comment.user.type != 'Bot' &&
          (github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'COLLABORATOR' ||
            github.event.comment.user.login == 'Mohammadlali'))
      )
    steps:
      - name: Ack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Notion AI is on it. Will reply when done."

      - name: POST n8n webhook
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          payload = {
            "owner": owner,
            "repo": repo,
            "issue_number": int(os.environ["ISSUE_NUM"]),
            "title": os.environ.get("ISSUE_TITLE") or "",
            "body": os.environ.get("ISSUE_BODY") or "",
            "comment_body": os.environ.get("COMMENT_BODY") or "",
            "html_url": os.environ.get("ISSUE_URL") or "",
            "sender": os.environ.get("SENDER") or "",
          }
          data = json.dumps(payload).encode("utf-8")
          url = "https://n8n.airboxvip.top/webhook/notion-issue-bot"
          last_err = None
          for attempt in range(1, 6):
            req = urllib.request.Request(
              url,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
            )
            try:
              with urllib.request.urlopen(req, timeout=30) as res:
                print(res.status, res.read()[:500])
                raise SystemExit(0)
            except urllib.error.HTTPError as e:
              last_err = e
              print("attempt %s: HTTP %s %s" % (attempt, e.code, e.read()[:500]))
            except Exception as e:
              last_err = e
              print("attempt %s: %s" % (attempt, e))
            time.sleep(2 * attempt)
          raise SystemExit("webhook failed: %s" % last_err)
          PY
