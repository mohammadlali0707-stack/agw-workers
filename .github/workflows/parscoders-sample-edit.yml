name: ParsCoders sample edit

# Inspect, edit (description) or replace the image of ONE ParsCoders
# portfolio sample (test: sample 61734).
# inspect = read-only form dump + upload-widget dump; edit = change ONLY the
# description (title/skills untouched, no file attached) and resubmit once;
# image = attach ONLY the file in `image` (repo path under
# scripts/site_proposal/assets/), keep title/description/skills untouched,
# and resubmit once. The description must contain no link/address (the
# script aborts if it finds anything URL-like). Manual dispatch only. Run
# logs are public, so the script prints RESULT lines only - never session
# values.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique job ID (used for the results subdir)'
        required: true
        type: string
      mode:
        description: 'inspect dumps the form; edit submits the new description; image attaches the file in `image`'
        required: true
        default: 'inspect'
        type: choice
        options:
          - inspect
          - edit
          - image
      sample_id:
        description: 'Portfolio sample id (default 61734)'
        required: false
        default: '61734'
        type: string
      title:
        description: 'Expected sample title (the form must show it, else abort)'
        required: false
        default: ''
        type: string
      description:
        description: 'New description (edit mode only; no links/addresses)'
        required: false
        default: ''
        type: string
      image:
        description: 'Repo-relative image path to attach (image mode only, e.g. scripts/site_proposal/assets/stars_new.png)'
        required: false
        default: ''
        type: string

run-name: parscoders-sample-edit ${{ inputs.mode }} ${{ inputs.sample_id }}

permissions:
  contents: read

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB_ID_INPUT: ${{ inputs.job_id }}
      GH_TOKEN: ${{ secrets.ACC6_PAT }}
      SECRET_REPO: mohammadlali0707-stack/agw-workers
      RESULTS_REPO: mohammadlali0707-stack/hq-ai-results
    steps:
      - name: Checkout agw-workers
        uses: actions/checkout@v4

      - name: Checkout hq-ai-results (private, for results)
        uses: actions/checkout@v4
        with:
          repository: mohammadlali0707-stack/hq-ai-results
          token: ${{ secrets.ACC6_PAT || secrets.GITHUB_TOKEN }}
          path: hq-ai-results

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Set up Oracle exit (Xray)
        env:
          XRAY_CONFIG: ${{ secrets.XRAY_CONFIG }}
        run: |
          set +e
          curl -sSL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip && unzip -qo /tmp/xray.zip -d /tmp/xray
          printf '%s' "$XRAY_CONFIG" > /tmp/xray/config.json
          (/tmp/xray/xray run -c /tmp/xray/config.json > /tmp/xray.log 2>&1 &)
          sleep 3
          echo "egress via proxy: $(curl -sf --max-time 15 --proxy http://127.0.0.1:10809 https://ifconfig.me)"
          echo "xray started"

      - name: Inspect / edit sample
        env:
          SITE_SESSION_PARSCODERS: ${{ secrets.SITE_SESSION_PARSCODERS }}
          GWEB_PROXY: http://127.0.0.1:10809
          EDIT_RESULTS_DIR: hq-ai-results
          EDIT_JOB_ID: ${{ inputs.job_id }}
          EDIT_MODE: ${{ inputs.mode }}
          SAMPLE_ID: ${{ inputs.sample_id }}
          EXPECTED_TITLE: ${{ inputs.title }}
          NEW_DESCRIPTION: ${{ inputs.description }}
          IMAGE_FILE: ${{ inputs.image }}
        run: python3 scripts/site_proposal/parscoders_sample_edit.py

      - name: Commit and push results (private repo)
        if: always()
        run: |
          cd hq-ai-results
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d "jobs/${JOB_ID_INPUT}" ] && git add "jobs/${JOB_ID_INPUT}"
          if git diff --staged --quiet; then
            echo "No changes to commit in hq-ai-results."
            exit 0
          fi
          git commit -m "parscoders-sample-edit: job ${JOB_ID_INPUT} [skip ci]"
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i of $MAX_RETRIES..."
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "Results published to private results repo."
              exit 0
            fi
            sleep $((i * 2))
          done
          echo "WARNING: failed to push results to hq-ai-results after $MAX_RETRIES attempts."
          exit 1
