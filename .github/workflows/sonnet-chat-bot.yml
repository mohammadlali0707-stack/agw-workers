name: AGW Sonnet interactive chat (issue session)

# Trailing @sonnet-chat opens a labeled session on this issue. Later human
# comments on the same issue continue the chat without a new tag. Memory is
# the full issue thread (each turn is a new Actions job; GitHub cannot keep
# a process alive). Close with trailing @sonnet-chat-end.
# Pins Claude Sonnet 4.6 (Thinking), round-robins AGW_TOKEN_ACC0-ACC8, quota-walks.
# Does not clone a project repo and does not dispatch agw-worker.yml.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: sonnet-chat-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  check-marker:
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity/API for this repo -- back to GitHub-hosted until further notice
    timeout-minutes: 5
    if: >
      (github.event_name == 'issue_comment' &&
        github.event.comment.user.type != 'Bot' &&
        (contains(github.event.comment.body, '@sonnet-chat') ||
          contains(join(github.event.issue.labels.*.name, ','), 'sonnet-chat'))) ||
      (github.event_name == 'issues' &&
        contains(github.event.issue.body, '@sonnet-chat'))
    outputs:
      action: ${{ steps.check.outputs.action }}
      acc_index: ${{ steps.check.outputs.acc_index }}
    steps:
      - name: Classify start / continue / end
        id: check
        env:
          BODY: ${{ github.event.comment.body || github.event.issue.body || '' }}
          TITLE: ${{ github.event.issue.title || '' }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          strip_footer() {
            python3 - "$1" <<'PYEOF'
          import re, sys
          text = sys.argv[1]
          lines = text.split("\n")
          pat = re.compile(
              r"^\s*(-{3,}|\*{3,}|_?Generated by \[[^\]]*\]\([^)]*\)_?|"
              r"<!--.*?-->|Co-Authored-By:.*|Claude-Session:.*|\s*)\s*$")
          while lines and pat.match(lines[-1]):
              lines.pop()
          sys.stdout.write("\n".join(lines))
          PYEOF
          }
          TRIMMED="$(printf '%s\n%s' "$TITLE" "$BODY" | sed -e 's/[[:space:]]*$//')"
          TRIMMED="$(strip_footer "$TRIMMED")"
          LOWER="$(printf '%s' "$TRIMMED" | tr '[:upper:]' '[:lower:]')"
          HAS_LABEL=false
          case ",$LABELS," in
            *,sonnet-chat,*) HAS_LABEL=true ;;
          esac
          ACC_IDX=$(( GITHUB_RUN_NUMBER % 9 ))
          echo "acc_index=$ACC_IDX" >> "$GITHUB_OUTPUT"
          case "$LOWER" in
            *"@sonnet-chat-end")
              echo "action=end" >> "$GITHUB_OUTPUT"
              ;;
            *"@sonnet-chat")
              if [ "$HAS_LABEL" = "true" ]; then
                echo "action=continue" >> "$GITHUB_OUTPUT"
              else
                echo "action=start" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              if [ "$HAS_LABEL" = "true" ]; then
                if echo "$LOWER" | grep -qE '(^|[[:space:]])@(agy-plan-approved|sonnet-plan-approved|agy-plan|sonnet-plan|agy-asset|agy|sonnet)[[:space:]]*$'; then
                  echo "action=none" >> "$GITHUB_OUTPUT"
                else
                  echo "action=continue" >> "$GITHUB_OUTPUT"
                fi
              else
                echo "action=none" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

  end-session:
    needs: [check-marker]
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity/API for this repo -- back to GitHub-hosted until further notice
    timeout-minutes: 5
    if: >
      needs.check-marker.outputs.action == 'end' &&
      (
        (github.event_name == 'issues' &&
          (github.event.issue.author_association == 'OWNER' ||
            github.event.issue.author_association == 'COLLABORATOR' ||
            github.event.issue.user.login == 'Mohammadlali')
        ) ||
        (github.event_name == 'issue_comment' &&
          github.event.comment.user.type != 'Bot' &&
          (github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'COLLABORATOR' ||
            github.event.comment.user.login == 'Mohammadlali')
        )
      )
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Close the chat session label
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label sonnet-chat || true
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "نشست @sonnet-chat بسته شد. برای شروع دوباره، پیام را با @sonnet-chat تمام کن."

  chat:
    needs: [check-marker]
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity/API for this repo -- back to GitHub-hosted until further notice
    timeout-minutes: 45
    if: >
      (needs.check-marker.outputs.action == 'start' ||
        needs.check-marker.outputs.action == 'continue') &&
      (
        (github.event_name == 'issues' &&
          (github.event.issue.author_association == 'OWNER' ||
            github.event.issue.author_association == 'COLLABORATOR' ||
            github.event.issue.user.login == 'Mohammadlali')
        ) ||
        (github.event_name == 'issue_comment' &&
          github.event.comment.user.type != 'Bot' &&
          (github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'COLLABORATOR' ||
            github.event.comment.user.login == 'Mohammadlali')
        )
      )
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      PRIMARY_IDX: ${{ needs.check-marker.outputs.acc_index }}
      ACTION: ${{ needs.check-marker.outputs.action }}
    steps:
      - name: Open session label and ack
        if: env.ACTION == 'start'
        run: |
          gh label create sonnet-chat \
            --repo "$REPO" \
            --color 6F42C1 \
            --description "Interactive @sonnet-chat session" 2>/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label sonnet-chat
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "نشست @sonnet-chat باز شد. پیام‌هایت را همین‌جا بفرست؛ لازم نیست دوباره تگ کنی. حافظه = کل همین ایشو (هر نوبت یک جاب تازه است، ولی تاریخچه خوانده می‌شود). بستن: @sonnet-chat-end"

      - name: Install AGY CLI from HF Dataset
        run: |
          curl -L \
            "https://huggingface.co/datasets/stranger777777/agw-cli-bin/resolve/main/cli_linux_x64.tar.gz" \
            -o /tmp/cli.tar.gz
          mkdir -p /tmp/agx
          tar -xzf /tmp/cli.tar.gz -C /tmp/agx
          CLI_BIN=$(find /tmp/agx -type f \( -name "antigravity" -o -name "agy" \) | head -1)
          if [ -z "$CLI_BIN" ]; then
            CLI_BIN=$(find /tmp/agx -type f -executable | head -1)
          fi
          AGY_BIN_DIR="${RUNNER_TEMP:-/tmp}/agy-bin"
          mkdir -p "$AGY_BIN_DIR"
          install -m 0755 "$CLI_BIN" "$AGY_BIN_DIR/agy"
          echo "$AGY_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$AGY_BIN_DIR:$PATH"
          agy --version 2>/dev/null || echo "agy ready"

      - name: Fetch the full issue thread (session memory)
        run: |
          gh issue view "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --json title,body,comments \
            --jq '"ISSUE: " + .title + "\n" + .body + "\n\n" + ([.comments[] | "--- COMMENT by " + .author.login + " ---\n" + .body] | join("\n\n"))' \
            > /tmp/thread.txt || echo "(could not fetch thread)" > /tmp/thread.txt

      - name: Build the chat prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          strip_marker() {
            python3 - "$1" <<'PYEOF'
          import re, sys
          text = sys.argv[1]
          text = re.sub(
              r'(?i)(?:^|\s)@(?:sonnet-chat-end|sonnet-chat)\s*$',
              '',
              text.strip(),
          )
          sys.stdout.write(text.strip())
          PYEOF
          }
          SAFE_TITLE=$(printf '%s' "$ISSUE_TITLE" | tr -d '`\\$')
          SAFE_BODY=$(printf '%s' "$ISSUE_BODY" | sanitize)
          SAFE_COMMENT=$(printf '%s' "$COMMENT_BODY" | sanitize)
          if [ -n "$SAFE_COMMENT" ]; then
            LATEST="$(strip_marker "$SAFE_COMMENT")"
          else
            LATEST="$(strip_marker "$SAFE_BODY")"
          fi
          {
            printf '%s\n' 'You are AGY in an interactive chat session on this GitHub issue.'
            printf '%s\n' 'The full conversation below is your memory. Use it. Do not forget earlier user messages in this thread.'
            printf '%s\n' 'Reply to the LATEST USER MESSAGE. Match the user language (Persian if they wrote Persian).'
            printf '%s\n' 'This is a conversation, not a one-shot worker assignment. If they ask a question or status check, answer it. Do not invent extra work (ingest, commits, new files, workflow dispatches) unless the latest message explicitly asks for that.'
            printf '%s\n' 'Do not write, edit, or commit files unless the latest message explicitly asks you to.'
            printf '%s\n' 'Ignore session open/close notices from github-actions. Ignore trailing @sonnet-chat / @sonnet-chat-end routing tags; they are not part of the message.'
            printf '%s\n' 'Do not include a trailing @agy, @sonnet, @sonnet-chat, @sonnet-plan, or similar marker in your reply.'
            printf '\n%s\n' '--- CONVERSATION SO FAR (memory) ---'
            cat /tmp/thread.txt | sanitize
            printf '\n%s\n' '--- END CONVERSATION ---'
            printf '\n%s\n' 'LATEST USER MESSAGE:'
            printf '%s\n' "$LATEST"
          } > /tmp/prompt.txt

      - name: Run AGY chat (Sonnet 4.6, round-robin + quota-walk ACC0-ACC8)
        id: run_agy
        env:
          MODEL_INPUT: "Claude Sonnet 4.6 (Thinking)"
        run: |
          set +e
          restore_token() {
            local idx="$1"
            mkdir -p ~/.gemini/antigravity-cli ~/.gemini/config
            local token_b64=""
            case "$idx" in
              0) token_b64="${{ secrets.AGW_TOKEN_ACC0 }}" ;;
              1) token_b64="${{ secrets.AGW_TOKEN_ACC1 }}" ;;
              2) token_b64="${{ secrets.AGW_TOKEN_ACC2 }}" ;;
              3) token_b64="${{ secrets.AGW_TOKEN_ACC3 }}" ;;
              4) token_b64="${{ secrets.AGW_TOKEN_ACC4 }}" ;;
              5) token_b64="${{ secrets.AGW_TOKEN_ACC5 }}" ;;
              6) token_b64="${{ secrets.AGW_TOKEN_ACC6 }}" ;;
              7) token_b64="${{ secrets.AGW_TOKEN_ACC7 }}" ;;
              8) token_b64="${{ secrets.AGW_TOKEN_ACC8 }}" ;;
            esac
            echo "$token_b64" | base64 -d > ~/.gemini/antigravity-cli/antigravity-oauth-token
            chmod 600 ~/.gemini/antigravity-cli/antigravity-oauth-token
            cat /proc/sys/kernel/random/uuid > ~/.gemini/antigravity-cli/installation_id
            echo '{"userSettings":{}}' > ~/.gemini/config/config.json
            echo "Restored acc${idx}: $(wc -c < ~/.gemini/antigravity-cli/antigravity-oauth-token) bytes"
          }
          is_quota_error() {
            grep -qiE 'too many requests|rate limit|rate-limit|429|quota' "$1"
          }
          PROMPT=$(cat /tmp/prompt.txt)
          USED_IDX="$PRIMARY_IDX"
          if [ -z "$USED_IDX" ]; then USED_IDX=$(( GITHUB_RUN_NUMBER % 9 )); fi
          restore_token "$USED_IDX"
          echo "Running agy --model $MODEL_INPUT with acc${USED_IDX}..."
          OUTPUT=$(timeout 1700 agy --model "$MODEL_INPUT" --dangerously-skip-permissions --print-timeout 1680s -p "$PROMPT" 2>&1)
          echo "$OUTPUT" > /tmp/agy_output.txt
          TRIED=1
          while is_quota_error /tmp/agy_output.txt && [ "$TRIED" -lt 9 ]; do
            NEXT_IDX=$(( (USED_IDX + 1) % 9 ))
            echo "::warning::acc${USED_IDX} hit a quota/rate-limit error, trying next identity acc${NEXT_IDX}"
            USED_IDX="$NEXT_IDX"
            restore_token "$USED_IDX"
            echo "Retrying with acc${USED_IDX}..."
            OUTPUT=$(timeout 1700 agy --model "$MODEL_INPUT" --dangerously-skip-permissions --print-timeout 1680s -p "$PROMPT" 2>&1)
            echo "$OUTPUT" > /tmp/agy_output.txt
            TRIED=$((TRIED + 1))
          done
          echo "used_idx=$USED_IDX" >> "$GITHUB_OUTPUT"
          echo "Output lines: $(wc -l < /tmp/agy_output.txt)"

      - name: Post the chat reply
        run: |
          if [ ! -s /tmp/agy_output.txt ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$REPO" \
              --body "جواب ساخته نشد (خروجی خالی). دوباره در همین ایشو پیام بفرست."
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --body-file /tmp/agy_output.txt
