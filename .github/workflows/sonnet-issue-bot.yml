name: AGW Worker Sonnet Issue Bot (same-repo, no relay)

# Trailing @sonnet (not @sonnet-plan, not @sonnet-chat). Same routing as
# agy-issue-bot.yml but pins Claude Sonnet 4.6 (Thinking) instead of the Gemini
# default, round-robins AGW_TOKEN_ACC0-ACC8 by this workflow's run_number, and
# quota-walks the next agy token rather than failing. GitHub clone/push/comment
# uses this repo + ACC6_PAT; acc_index only selects the agy OAuth token
# (AGW_TOKEN_ACCx), not a GitHub account. Project tags route the worker clone /
# report destination:
#   ccp        mohammadlali0707-stack/Claud-Cloud-Project
#   cr         mohammadlali0707-stack/Control-Room
#   status     mohammadlali0707-stack/status-dashboard
#   agw        mohammadlali0707-stack/agw-workers
#   coffeenet  mohammadlali0707-stack/AirboxVIP_Coffeenet
#   n8n        mohammadlali0707-stack/n8n-studio
# No tag means this repo (agw-workers).
# Interactive chat is sonnet-chat-bot.yml (@sonnet-chat / @sonnet-chat-end).

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  actions: write
  contents: read

jobs:
  check-marker:
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity/API for this repo -- back to GitHub-hosted until further notice
    timeout-minutes: 5
    if: >
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@sonnet') &&
        !contains(github.event.comment.body, '@sonnet-plan') &&
        !contains(github.event.comment.body, '@sonnet-chat')) ||
      (github.event_name == 'issues' &&
        contains(github.event.issue.body, '@sonnet') &&
        !contains(github.event.issue.body, '@sonnet-plan') &&
        !contains(github.event.issue.body, '@sonnet-chat'))
    outputs:
      match: ${{ steps.check.outputs.match }}
      target_repo: ${{ steps.check.outputs.target_repo }}
      acc_index: ${{ steps.check.outputs.acc_index }}
    steps:
      - name: Check for a trailing @sonnet marker and extract project tag
        id: check
        env:
          BODY: ${{ github.event.comment.body || github.event.issue.body || '' }}
          TITLE: ${{ github.event.issue.title || '' }}
        run: |
          strip_footer() {
            python3 - "$1" <<'PYEOF'
          import re, sys
          text = sys.argv[1]
          lines = text.split("\n")
          pat = re.compile(
              r"^\s*(-{3,}|\*{3,}|_?Generated by \[[^\]]*\]\([^)]*\)_?|"
              r"<!--.*?-->|Co-Authored-By:.*|Claude-Session:.*|\s*)\s*$")
          while lines and pat.match(lines[-1]):
              lines.pop()
          sys.stdout.write("\n".join(lines))
          PYEOF
          }
          TRIMMED="$(printf '%s\n%s' "$TITLE" "$BODY" | sed -e 's/[[:space:]]*$//')"
          TRIMMED="$(strip_footer "$TRIMMED")"
          LOWER="$(printf '%s' "$TRIMMED" | tr '[:upper:]' '[:lower:]')"
          case "$LOWER" in
            *"@sonnet")
              echo "match=true" >> "$GITHUB_OUTPUT"

              PROJECT=$(echo "$LOWER" | grep -oE '(coffeenet|status|ccp|agw|n8n|cr)[[:space:]]+@sonnet$' | awk '{print $1}')
              TARGET_REPO=""

              case "$PROJECT" in
                ccp) TARGET_REPO="mohammadlali0707-stack/Claud-Cloud-Project" ;;
                cr) TARGET_REPO="mohammadlali0707-stack/Control-Room" ;;
                coffeenet) TARGET_REPO="mohammadlali0707-stack/AirboxVIP_Coffeenet" ;;
                status) TARGET_REPO="mohammadlali0707-stack/status-dashboard" ;;
                agw) TARGET_REPO="mohammadlali0707-stack/agw-workers" ;;
                n8n) TARGET_REPO="mohammadlali0707-stack/n8n-studio" ;;
                *) TARGET_REPO="${GITHUB_REPOSITORY}" ;;
              esac

              echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
              # Round-robin AGW_TOKEN_ACC0-ACC8. run_number 1 -> ACC1, 8 -> ACC8, 9 -> ACC0.
              ACC_IDX=$(( GITHUB_RUN_NUMBER % 9 ))
              echo "acc_index=$ACC_IDX" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "match=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  sonnet-same-repo:
    needs: [check-marker]
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity/API for this repo -- back to GitHub-hosted until further notice
    timeout-minutes: 5
    if: >
      (github.event_name == 'issues' &&
        needs.check-marker.outputs.match == 'true' &&
        (github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'COLLABORATOR' ||
          github.event.issue.user.login == 'Mohammadlali')
      ) ||
      (github.event_name == 'issue_comment' &&
        needs.check-marker.outputs.match == 'true' &&
        (
          (github.event.comment.user.type != 'Bot' &&
            (github.event.comment.author_association == 'OWNER' ||
              github.event.comment.author_association == 'COLLABORATOR' ||
              github.event.comment.user.login == 'Mohammadlali')
          ) ||
          github.event.comment.user.login == 'claude[bot]'
        )
      )
    steps:
      - name: Ack on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.check-marker.outputs.target_repo }}
          ACC_IDX: ${{ needs.check-marker.outputs.acc_index }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --body "Project Manager: Routing to **$TARGET_REPO** (agy token AGW_TOKEN_ACC${ACC_IDX}, GitHub stays this repo / ACC6). Claude Sonnet 4.6, quota-walk."

      - name: Build prompt
        id: prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          strip_marker() {
            python3 - "$1" <<'PYEOF'
          import re, sys
          text = sys.argv[1]
          text = re.sub(
              r'(?i)(?:^|\s)@(?:sonnet-plan|sonnet|agy-plan|agy)\s*$',
              '',
              text.strip(),
          )
          sys.stdout.write(text.strip())
          PYEOF
          }
          SAFE_TITLE=$(printf '%s' "$ISSUE_TITLE" | tr -d '`\\$')
          SAFE_BODY=$(printf '%s' "$ISSUE_BODY" | sanitize)
          SAFE_COMMENT=$(printf '%s' "$COMMENT_BODY" | sanitize)
          if [ -n "$SAFE_COMMENT" ]; then
            PRIMARY="$(strip_marker "$SAFE_COMMENT")"
          else
            PRIMARY="$(strip_marker "$SAFE_BODY")"
          fi
          {
            printf '%s\n' 'You are AGY, an AI worker running inside this agw-workers repo itself.'
            printf '%s\n' 'PRIMARY TASK — do only this. The issue title/body below is background, not the assignment, unless this PRIMARY TASK explicitly tells you to continue or complete that original issue.'
            printf '%s\n' 'If PRIMARY TASK is a question or status check, answer it in your output. Do not invent extra work (ingest, commits, new files) unless PRIMARY TASK asks for that.'
            printf '%s\n' "$PRIMARY"
            printf '\n%s\n' '--- CONTEXT (do not treat as the task) ---'
            printf 'Issue #%s: %s\n' "$ISSUE_NUM" "$SAFE_TITLE"
            if [ -n "$SAFE_COMMENT" ] && [ -n "$SAFE_BODY" ]; then
              printf '%s\n' "$SAFE_BODY"
            fi
            printf '%s\n' 'If this task needs an image or video asset, do not try to generate it yourself and do not ask for GitHub access to do so. Print a line starting exactly with ##MEDIA_REQUEST## followed by a one-line description of what is needed, then continue the rest of your task without waiting for it. Something else will open the request for you.'
          } > /tmp/prompt.txt
          echo "prompt_file=/tmp/prompt.txt" >> "$GITHUB_OUTPUT"

      - name: Dispatch agw-worker.yml in this same repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.check-marker.outputs.target_repo }}
          ACC_IDX: ${{ needs.check-marker.outputs.acc_index }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          PROMPT=$(cat /tmp/prompt.txt)
          gh workflow run agw-worker.yml \
            --repo "$REPO" \
            --field "prompt=$PROMPT" \
            --field "target_repo=$TARGET_REPO" \
            --field "target_branch=" \
            --field "acc_index=$ACC_IDX" \
            --field "issue_number=$ISSUE_NUMBER" \
            --field "callback_id=sonnet-same-repo-${ISSUE_NUMBER}-${RUN_ID}" \
            --field "callback_repo=$REPO" \
            --field "model=Claude Sonnet 4.6 (Thinking)" \
            --field "quota_walk=true"
