name: "TEST: agy auth with fixed install_id + v1.2.14 (ACC3)"

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  test-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install AGY CLI v1.2.14 from GitHub Release
        run: |
          curl -fsSL \
            "https://github.com/mohammadlali0707-stack/agw-workers/releases/download/agy-cli-v1.2.14/cli_linux_x64.tar.gz" \
            -o /tmp/cli.tar.gz
          mkdir -p /tmp/agx
          tar -xzf /tmp/cli.tar.gz -C /tmp/agx
          CLI_BIN=$(find /tmp/agx -type f \( -name "antigravity" -o -name "agy" \) | head -1)
          [ -z "$CLI_BIN" ] && CLI_BIN=$(find /tmp/agx -type f -executable | head -1)
          AGY_BIN_DIR="${RUNNER_TEMP:-/tmp}/agy-bin"
          mkdir -p "$AGY_BIN_DIR"
          install -m 0755 "$CLI_BIN" "$AGY_BIN_DIR/agy"
          echo "$AGY_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$AGY_BIN_DIR:$PATH"
          echo "agy version: $(agy --version 2>/dev/null)"

      - name: Restore ACC3 token with FIXED installation_id
        env:
          AGW_TOKEN_ACC3:      ${{ secrets.AGW_TOKEN_ACC3 }}
          AGW_INSTALL_ID_ACC3: ${{ secrets.AGW_INSTALL_ID_ACC3 }}
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli" "$HOME/.gemini/config"
          printf '%s' "$AGW_TOKEN_ACC3" | base64 -d > "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
          chmod 600 "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
          # Use FIXED installation_id from container secret
          printf '%s' "$AGW_INSTALL_ID_ACC3" > "$HOME/.gemini/antigravity-cli/installation_id"
          echo '{"userSettings":{}}' > "$HOME/.gemini/config/config.json"
          # Show token metadata (no values)
          TOKEN_FILE="$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
          echo "Token file bytes: $(wc -c < "$TOKEN_FILE")"
          echo "Has access_token: $(python3 -c "import json; d=json.load(open('$TOKEN_FILE')); print(bool(d.get('token',{}).get('access_token')))")"
          echo "Has refresh_token: $(python3 -c "import json; d=json.load(open('$TOKEN_FILE')); print(bool(d.get('token',{}).get('refresh_token')))")"
          echo "Expiry: $(python3 -c "import json; d=json.load(open('$TOKEN_FILE')); print(d.get('token',{}).get('expiry','?'))")"
          echo "install_id bytes: $(wc -c < "$HOME/.gemini/antigravity-cli/installation_id")"

      - name: Run agy with a simple prompt (test auto-refresh on expired token)
        id: agy_test
        run: |
          echo "Running agy..."
          set +e
          timeout 120 agy --dangerously-skip-permissions --print-timeout 90s \
            -p "Reply with exactly one word: OK" \
            > /tmp/agy_out.txt 2>&1
          AGY_RC=$?
          echo "Exit code: $AGY_RC"
          echo "Output bytes: $(wc -c < /tmp/agy_out.txt)"
          # Classify (no raw output)
          if grep -qiE 'authentication required|auth.*failed|sign in|log in|run .agy. to' /tmp/agy_out.txt; then
            RESULT="fail_auth"
          elif grep -qiE 'quota|rate.?limit|429|too many' /tmp/agy_out.txt; then
            RESULT="ok_quota"
          elif [ "$AGY_RC" -eq 0 ]; then
            RESULT="ok"
          else
            # Show last 3 lines of output for debugging (masked by add-mask above)
            LAST=$(tail -3 /tmp/agy_out.txt | head -c 200)
            echo "Last output lines: $LAST"
            RESULT="unknown_rc${AGY_RC}"
          fi
          echo "RESULT=$RESULT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Report result as issue comment
        if: always()
        env:
          RESULT: ${{ steps.agy_test.outputs.result }}
        run: |
          MSG="**AGY auth test (ACC3, v1.2.14 + fixed install_id):** \`${RESULT:-skipped}\`"
          if echo "$RESULT" | grep -qE '^(ok|ok_quota)$'; then
            MSG="${MSG} ✅ — خودبه‌خود refresh کرد!"
          else
            MSG="${MSG} ❌"
          fi
          gh issue comment 70 \
            --repo mohammadlali0707-stack/agw-workers \
            --body "$MSG" || echo "Could not post comment"
