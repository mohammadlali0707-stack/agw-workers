name: One-off -- sync agy-lead-plan.yml to all forks

on:
  workflow_dispatch:

jobs:
  sync-lead-plan:
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity/API for this repo -- back to GitHub-hosted until further notice
    env:
      ACC1_PAT: ${{ secrets.ACC1_PAT }}
      ACC2_PAT: ${{ secrets.ACC2_PAT }}
      ACC3_PAT: ${{ secrets.ACC3_PAT }}
      ACC4_PAT: ${{ secrets.ACC4_PAT }}
      ACC5_PAT: ${{ secrets.ACC5_PAT }}
      ACC7_PAT: ${{ secrets.ACC7_PAT }}
      ACC8_PAT: ${{ secrets.ACC8_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Push agy-lead-plan.yml to all forks
        run: |
          set -e
          CONTENT=$(base64 -w0 .github/workflows/agy-lead-plan.yml)
          MSG="fix: sync agy-lead-plan.yml runner.temp AGENT_REPO fix to fork"

          push_to() {
            local REPO="$1" TOKEN="$2"
            [ -z "$TOKEN" ] && echo "skip $REPO (no token)" && return
            SHA=$(curl -s -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/repos/$REPO/contents/.github/workflows/agy-lead-plan.yml" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null)
            BODY="{\"message\":\"$MSG\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
            R=$(curl -s -X PUT -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/contents/.github/workflows/agy-lead-plan.yml" \
              -d "$BODY")
            echo "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); print('OK' if 'commit' in d else 'FAIL: '+d.get('message','?'))" && echo "  $REPO"
          }

          push_to "momonakikugava-pixel/agw-workers" "$ACC1_PAT"
          push_to "lali94m-max/agw-workers"          "$ACC2_PAT"
          push_to "ngocgminh5-debug/agw-workers"     "$ACC3_PAT"
          push_to "hmmletssee7-design/agw-workers"   "$ACC4_PAT"
          push_to "kidding602/agw-workers"            "$ACC5_PAT"
          push_to "mohammad97okk/agw-workers"         "$ACC7_PAT"
          push_to "moradzahra85-png/agw-workers"      "$ACC8_PAT"