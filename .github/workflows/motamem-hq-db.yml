name: Motamem HQ DB (one-shot)
on:
  push:
    paths: ["motamem/hq_db/**"]
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run on VPS
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USR: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/k; chmod 600 ~/.ssh/k
          O="-i $HOME/.ssh/k -o StrictHostKeyChecking=no"
          ssh $O -p "$PORT" "$USR@$HOST" "mkdir -p /root/motamem_hq"
          scp $O -P "$PORT" motamem/hq_db/* "$USR@$HOST:/root/motamem_hq/"
          ssh $O -p "$PORT" "$USR@$HOST" "python3 /root/motamem_hq/create_hq_db.py" | tee result.txt
