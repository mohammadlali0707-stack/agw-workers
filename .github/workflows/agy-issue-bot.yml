name: AGW Worker AGY Issue Bot (same-repo, no relay)

# Fixed 2026-09-14, two independent bugs, both measured live before being
# fixed (not guessed):
#
# 1. GitHub Actions expression strings have NO escape sequences --
#    endsWith(body, '@agy\n') matches the literal characters backslash-n,
#    never a real trailing newline, so a real issue/comment body (which
#    always ends in an actual newline once GitHub normalizes it) could
#    never match. Replaced with a real bash check in a separate
#    check-marker job, same pattern already used to fix this identical bug
#    in Claud-Cloud-Project's and Mohammadlali/agw-workers's own copies of
#    this file earlier the same day.
# 2. `author_association == 'OWNER'` can never be true for issues this
#    repo's own dashboard chat creates: status-dashboard/api/agy_create.js
#    posts using AGY_CHAT_ACC0_PAT (the Mohammadlali account), which has NO
#    relationship at all to this repo (owned by mohammadlali0707-stack) --
#    confirmed by reading a real such issue (#8) back: author_association
#    was "NONE", not even "COLLABORATOR" (unlike Claud-Cloud-Project, where
#    the same PAT/repo-ownership combination reads back as COLLABORATOR).
#    Rather than adding Mohammadlali as a collaborator on this repo (a real
#    permissions change outside this fix's scope), trust by login name
#    instead for that one known account, same as the existing
#    `user.login == 'claude[bot]'` carve-out just below already does for
#    comments.
#
# 2026-09-24: a trailing @agy with no project tag used to fall back to
# Control-Room. That clone then failed when the work was meant to stay in
# agw-workers. No tag now means this repo. Explicit ccp/cr/coffeenet/status
# tags still route to those project repos.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  actions: write
  contents: read

jobs:
  check-marker:
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity/API for this repo -- back to GitHub-hosted until further notice
    timeout-minutes: 5
    if: >
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@agy') &&
        !contains(github.event.comment.body, '@agy-asset') &&
        !contains(github.event.comment.body, '@agy-plan')) ||
      (github.event_name == 'issues' &&
        contains(github.event.issue.body, '@agy') &&
        !contains(github.event.issue.body, '@agy-asset') &&
        !contains(github.event.issue.body, '@agy-plan'))
    outputs:
      match: ${{ steps.check.outputs.match }}
      target_repo: ${{ steps.check.outputs.target_repo }}
      acc_index: ${{ steps.check.outputs.acc_index }}
    steps:
      - name: Check for a trailing @agy marker and extract project tag
        id: check
        env:
          BODY: ${{ github.event.comment.body || github.event.issue.body || '' }}
          TITLE: ${{ github.event.issue.title || '' }}
        run: |
          strip_footer() {
            python3 - "$1" <<'PYEOF'
          import re, sys
          text = sys.argv[1]
          lines = text.split("\n")
          pat = re.compile(
              r"^\s*(-{3,}|\*{3,}|_?Generated by \[[^\]]*\]\([^)]*\)_?|"
              r"<!--.*?-->|Co-Authored-By:.*|Claude-Session:.*|\s*)\s*$")
          while lines and pat.match(lines[-1]):
              lines.pop()
          sys.stdout.write("\n".join(lines))
          PYEOF
          }
          TRIMMED="$(printf '%s\n%s' "$TITLE" "$BODY" | sed -e 's/[[:space:]]*$//')"
          TRIMMED="$(strip_footer "$TRIMMED")"
          LOWER="$(printf '%s' "$TRIMMED" | tr '[:upper:]' '[:lower:]')"
          case "$LOWER" in
            *"@agy")
              echo "match=true" >> "$GITHUB_OUTPUT"

              PROJECT=$(echo "$LOWER" | grep -oE '(ccp|cr|coffeenet|status)[[:space:]]+@agy$' | awk '{print $1}')
              TARGET_REPO=""

              case "$PROJECT" in
                ccp) TARGET_REPO="mohammadlali0707-stack/Claud-Cloud-Project" ;;
                cr) TARGET_REPO="mohammadlali0707-stack/Control-Room" ;;
                coffeenet) TARGET_REPO="mohammadlali0707-stack/AirboxVIP_Coffeenet" ;;
                status) TARGET_REPO="mohammadlali0707-stack/status-dashboard" ;;
                *) TARGET_REPO="${GITHUB_REPOSITORY}" ;;
              esac

              ACC_IDX=$(( (RANDOM % 8) + 1 ))

              echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
              echo "acc_index=$ACC_IDX" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "match=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  agy-same-repo:
    needs: [check-marker]
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity/API for this repo -- back to GitHub-hosted until further notice
    timeout-minutes: 5
    if: >
      (github.event_name == 'issues' &&
        needs.check-marker.outputs.match == 'true' &&
        (github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'COLLABORATOR' ||
          github.event.issue.user.login == 'Mohammadlali')
      ) ||
      (github.event_name == 'issue_comment' &&
        needs.check-marker.outputs.match == 'true' &&
        (
          (github.event.comment.user.type != 'Bot' &&
            (github.event.comment.author_association == 'OWNER' ||
              github.event.comment.author_association == 'COLLABORATOR' ||
              github.event.comment.user.login == 'Mohammadlali')
          ) ||
          github.event.comment.user.login == 'claude[bot]'
        )
      )
    steps:
      - name: Ack on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.check-marker.outputs.target_repo }}
          ACC_IDX: ${{ needs.check-marker.outputs.acc_index }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --body "Project Manager: Routing to **$TARGET_REPO** via worker **ACC$ACC_IDX**."

      - name: Build prompt
        id: prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          SAFE_TITLE=$(printf '%s' "$ISSUE_TITLE" | tr -d '`\\$')
          SAFE_BODY=$(printf '%s' "$ISSUE_BODY" | sanitize)
          SAFE_COMMENT=$(printf '%s' "$COMMENT_BODY" | sanitize)
          {
            printf '%s\n' 'You are AGY, an AI worker running inside this agw-workers repo itself.'
            printf 'TASK - Issue #%s: %s\n' "$ISSUE_NUM" "$SAFE_TITLE"
            printf '%s\n' "$SAFE_BODY"
            printf '%s\n' 'If this task needs an image or video asset, do not try to generate it yourself and do not ask for GitHub access to do so. Print a line starting exactly with ##MEDIA_REQUEST## followed by a one-line description of what is needed, then continue the rest of your task without waiting for it. Something else will open the request for you.'
            if [ -n "$SAFE_COMMENT" ]; then
              printf '%s\n' 'LATEST COMMENT:'
              printf '%s\n' "$SAFE_COMMENT"
            fi
          } > /tmp/prompt.txt
          echo "prompt_file=/tmp/prompt.txt" >> "$GITHUB_OUTPUT"

      - name: Dispatch agw-worker.yml in this same repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ needs.check-marker.outputs.target_repo }}
          ACC_IDX: ${{ needs.check-marker.outputs.acc_index }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          PROMPT=$(cat /tmp/prompt.txt)
          gh workflow run agw-worker.yml \
            --repo "$REPO" \
            --field "prompt=$PROMPT" \
            --field "target_repo=$TARGET_REPO" \
            --field "target_branch=" \
            --field "acc_index=$ACC_IDX" \
            --field "issue_number=$ISSUE_NUMBER" \
            --field "callback_id=same-repo-${ISSUE_NUMBER}-${RUN_ID}" \
            --field "callback_repo=$REPO"
