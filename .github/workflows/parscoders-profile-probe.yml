name: ParsCoders profile probe

# Read-only probe: loads the sealed SITE_SESSION_PARSCODERS session, opens
# parscoders.com logged in, and reads the profile/account page to find the
# display name and the account email address. NEVER submits, fills or sends
# anything. The email is written ONLY into result.json in the PRIVATE
# hq-ai-results repo; the run log prints booleans/counts only (this repo is
# PUBLIC, so run logs are public). Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique job ID (used for the results subdir)'
        required: true
        type: string

run-name: parscoders-profile-probe ${{ inputs.job_id }}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOB_ID_INPUT: ${{ inputs.job_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout agw-workers
        uses: actions/checkout@v4

      - name: Checkout hq-ai-results (private, for results)
        uses: actions/checkout@v4
        with:
          repository: mohammadlali0707-stack/hq-ai-results
          token: ${{ secrets.ACC6_PAT }}
          path: hq-ai-results

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Set up Oracle exit (Xray)
        env:
          XRAY_CONFIG: ${{ secrets.XRAY_CONFIG }}
        run: |
          set +e
          curl -sSL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip && unzip -qo /tmp/xray.zip -d /tmp/xray
          printf '%s' "$XRAY_CONFIG" > /tmp/xray/config.json
          (/tmp/xray/xray run -c /tmp/xray/config.json > /tmp/xray.log 2>&1 &)
          sleep 3
          echo "egress via proxy: $(curl -sf --max-time 15 --proxy http://127.0.0.1:10809 https://ifconfig.me)"
          echo "xray started"

      - name: Run profile probe (read-only)
        env:
          SITE_SESSION_PARSCODERS: ${{ secrets.SITE_SESSION_PARSCODERS }}
          GWEB_PROXY: http://127.0.0.1:10809
          PROBE_RESULTS_DIR: hq-ai-results
          PROBE_JOB_ID: ${{ inputs.job_id }}
        run: python3 scripts/site_proposal/parscoders_profile_probe.py

      - name: Commit and push results (private repo)
        if: always()
        run: |
          cd hq-ai-results
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d "jobs/${JOB_ID_INPUT}" ] && git add "jobs/${JOB_ID_INPUT}"
          if git diff --staged --quiet; then
            echo "No changes to commit in hq-ai-results."
            exit 0
          fi
          git commit -m "parscoders-profile-probe: job ${JOB_ID_INPUT} [skip ci]"
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i of $MAX_RETRIES..."
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "Results published to private results repo."
              exit 0
            fi
            sleep $((i * 2))
          done
          echo "WARNING: failed to push results to hq-ai-results after $MAX_RETRIES attempts."
          exit 1
