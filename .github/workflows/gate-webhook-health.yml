name: Gate 2 -- Webhook Health Checker

on:
  schedule:
    # Every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  webhook-health:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      # Reading repos/{repo}/hooks needs ADMIN on the repo. GITHUB_TOKEN has no
      # webhook permission at all -- there is no `permissions:` key that grants
      # it -- so this gate answered 403 every hour since it was written, and
      # never reached the endpoint check below. A PAT with admin:repo_hook can
      # do it; GITHUB_TOKEN stays as the fallback for everything else.
      GH_TOKEN: ${{ secrets.ACC6_PAT || secrets.GITHUB_TOKEN }}
      EXPECTED_URL: "https://n8n.airboxvip.top/webhook/github-runner-trigger"
      REQUIRED_EVENTS: "issues issue_comment workflow_job"
    steps:
      - name: Check GitHub webhooks are correctly configured
        run: |
          set -e
          echo "=== Webhook Health Gate ==="
          REPO="${GITHUB_REPOSITORY}"
          FAILED=0

          # Not being ALLOWED to look is not the same as looking and finding a
          # problem. Reporting "webhook broken" when the real answer is "this
          # token cannot read webhooks" is a false alarm, and an hourly one
          # trains everybody to ignore the gate -- which is what happened.
          if ! HOOKS=$(gh api "repos/$REPO/hooks" 2>/tmp/hooks_err); then
            echo "::warning::cannot read this repo's webhooks -- $(tr -d '\n' < /tmp/hooks_err)"
            echo "Reading webhooks needs repo ADMIN. GITHUB_TOKEN never has it."
            echo "Set ACC6_PAT (or another PAT with admin:repo_hook) to enable"
            echo "the configuration half of this gate."
            echo '##TBS##{"data": {"reason": "no_webhook_read_permission"}, "probe": "webhook_health", "status": "skip", "v": 1}'
            echo "The endpoint reachability check below still runs, and still fails"
            echo "for real if n8n is down -- that part needs no GitHub permission."
            exit 0
          fi
          HOOK_COUNT=$(echo "$HOOKS" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "Found $HOOK_COUNT webhook(s)"

          # `echo "$HOOKS" | python3 - <<'EOF'` cannot work: `python3 -` takes the
          # PROGRAM from stdin, and the heredoc is what supplies it, so the pipe
          # is discarded and json.load(sys.stdin) reads an exhausted stream --
          # "Expecting value: line 1 column 1 (char 0)". This has been broken
          # since the gate was written; nobody saw it because the `gh api` call
          # above 403'd first and killed the step before Python ever ran. Fixing
          # the token is what exposed it. The data goes through a file now.
          printf '%s' "$HOOKS" > /tmp/hooks.json
          python3 - <<'EOF'
          import sys, json, os

          with open('/tmp/hooks.json', encoding='utf-8') as fh:
              hooks = json.load(fh)
          expected_url = os.environ['EXPECTED_URL']
          required_events = os.environ['REQUIRED_EVENTS'].split()

          # This gate is about ONE webhook: the AGY dispatch hook at
          # EXPECTED_URL. The original loop applied that single hook's contract
          # to EVERY hook on the repo, so the four real ones -- github-issue-
          # events, validate-n8n-json and secret-scan alongside it -- each got
          # "URL mismatch" and "missing events" for the crime of being a
          # different integration. Demanding that secret-scan subscribe to
          # issue_comment is not a health check, it is a false alarm. Measured
          # 2026-09-18, run 35328413573: the AGY hook passed every check while
          # the gate still reported failure.
          mine = [h for h in hooks if h['config'].get('url', '') == expected_url]
          others = [h for h in hooks if h not in mine]
          failed = False

          if not mine:
              print(f"  \u274c FAIL: no webhook points at {expected_url}")
              urls = [h['config'].get('url', '?') for h in hooks]
              print(f"     {len(hooks)} hook(s) present: {urls}")
              failed = True

          for hook in mine:
              url = hook['config'].get('url', '')
              events = hook.get('events', [])
              print(f"\nAGY hook #{hook['id']}: {url}")

              if '/webhook-test/' in url:
                  print("  \u274c FAIL: uses a webhook-test URL, not production")
                  failed = True
              else:
                  print("  \u2705 URL is production")

              missing = [e for e in required_events if e not in events]
              if missing:
                  print(f"  \u274c FAIL: missing events: {missing}")
                  failed = True
              else:
                  print(f"  \u2705 all required events present: {events}")

              if not hook.get('active', False):
                  print("  \u274c FAIL: webhook is inactive")
                  failed = True
              else:
                  print("  \u2705 active")

          for hook in others:
              # Reported, never judged: a different integration with its own
              # purpose and its own event list.
              print(f"\n(other integration, not this gate's business) "
                    f"#{hook['id']}: {hook['config'].get('url', '?')} "
                    f"events={hook.get('events', [])} active={hook.get('active')}")

          print('##TBS##' + json.dumps(
              {"data": {"hooks": len(hooks), "agy_hooks": len(mine),
                        "others": len(others)},
               "probe": "webhook_health",
               "status": "fail" if failed else "pass", "v": 1}, sort_keys=True))
          if failed:
              print("\n\u274c WEBHOOK HEALTH CHECK FAILED")
              if 'GITHUB_ENV' in os.environ:
                  with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as ge:
                      ge.write("FAIL_TYPE=config_error\n")
                      ge.write("FAIL_MESSAGE=GitHub repository webhook configuration error (missing events, inactive hook, or test URL)\n")
              sys.exit(1)
          print("\n\u2705 The AGY webhook is healthy")
          EOF

      - name: Verify webhook endpoint is reachable
        # always(): this half needs no GitHub permission, so a skipped
        # configuration check above must not silently skip it too.
        if: always()
        run: |
          echo "=== Checking n8n endpoint reachability ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$EXPECTED_URL" \
            -H "Content-Type: application/json" \
            -d '{"action":"health_check","test":true}' \
            --max-time 10 2>/dev/null || echo "000")

          echo "HTTP_STATUS=$STATUS" >> "$GITHUB_ENV"

          # n8n returns 200 (processed) or 400 (bad payload but reachable) = OK
          # 404 = webhook route not registered / wrong path (configuration error)
          # 000 / 5xx = server down, timeout, or server error (server failure)
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "400" ]; then
            echo "✅ n8n endpoint reachable (HTTP $STATUS)"
          elif [ "$STATUS" = "404" ]; then
            echo "FAIL_TYPE=config_error" >> "$GITHUB_ENV"
            echo "FAIL_MESSAGE=HTTP 404: Webhook route not found. The endpoint path is incorrect or the n8n workflow is inactive/unregistered." >> "$GITHUB_ENV"
           echo "❌ n8n endpoint config error (HTTP 404: route not found / workflow inactive)"
            exit 1
          elif [ "$STATUS" = "000" ] || [ "$STATUS" -ge 500 ] 2>/dev/null; then
            echo "FAIL_TYPE=server_failure" >> "$GITHUB_ENV"
            echo "FAIL_MESSAGE=HTTP $STATUS: Server failure or timeout. The n8n server is down, unreachable, or returning internal 5xx errors." >> "$GITHUB_ENV"
            echo "❌ n8n endpoint server failure (HTTP $STATUS: server down / timeout)"
            exit 1
          else
            echo "FAIL_TYPE=config_error" >> "$GITHUB_ENV"
            echo "FAIL_MESSAGE=HTTP $STATUS: Unexpected HTTP response received from webhook endpoint." >> "$GITHUB_ENV"
            echo "❌ n8n endpoint unexpected response (HTTP $STATUS)"
            exit 1
          fi

      - name: Post alert if webhook health fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.ACC6_PAT || secrets.GITHUB_TOKEN }}
          EXPECTED_URL: ${{ env.EXPECTED_URL }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -e
          REPO="${GITHUB_REPOSITORY}"
          ISSUE_TITLE="🚨 Webhook Health Gate Failed"

          # Construct bodies with python to prevent shell injection,
          # unescaped backtick issues, and ensure strict body length compliance.
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" <<'EOF'
          import os, datetime

          fail_type = os.environ.get('FAIL_TYPE', 'unknown')
          fail_msg = os.environ.get('FAIL_MESSAGE', 'Webhook health check failed.')
          http_status = os.environ.get('HTTP_STATUS', 'unknown')
          run_url = os.environ.get('RUN_URL', '')
          run_id = os.environ.get('RUN_ID', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          expected_url = os.environ.get('EXPECTED_URL', '')
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')

          if fail_type == 'config_error':
              cat_label = "⚠️ Configuration Error (HTTP 404 / Webhook Config)"
              diag = (
                  "- **HTTP 404 Route Not Found**: The endpoint path does not match an active route on n8n.\n"
                  "- **Deactivated Workflow**: The n8n workflow may have been unregistered. Run `.github/workflows/n8n-reactivate-webhooks.yml` or toggle Active in the n8n UI.\n"
                  "- **Webhook Settings**: Check that the webhook URL points to `/webhook/` (not `/webhook-test/`) and includes `issues`, `issue_comment`, `workflow_job`.\n"
                  f"- **Settings Link**: https://github.com/{repo}/settings/hooks"
              )
          elif fail_type == 'server_failure':
              cat_label = f"🔥 Server Failure (HTTP {http_status} / Timeout / Unreachable)"
              diag = (
                  f"- **n8n Server Down or Unreachable**: Endpoint returned HTTP {http_status}.\n"
                  "- **Network / Timeout**: The runner could not connect to n8n within the 10-second timeout.\n"
                  "- **Container Crashed**: Check n8n service logs or host health; restart container if down."
              )
          else:
              cat_label = f"❓ Gate Failure (HTTP {http_status})"
              diag = f"- Gate health check failed: {fail_msg}"

          issue_body = (
              "## Webhook Health Check Failed\n\n"
              "The automated webhook health gate detected a problem.\n\n"
              f"- **Timestamp:** {now}\n"
              f"- **Run:** [{run_id}]({run_url})\n"
              f"- **Failure Category:** {cat_label}\n"
              f"- **HTTP Status:** `{http_status}`\n"
              f"- **Target URL:** `{expected_url}`\n"
              f"- **Detail:** {fail_msg}\n\n"
              "### Diagnosis & Action:\n"
              f"{diag}\n"
          )[:60000]

          comment_body = (
              "### 🔄 Consecutive Webhook Gate Failure Update\n\n"
              f"- **Timestamp:** {now}\n"
              f"- **Run:** [{run_id}]({run_url})\n"
              f"- **Failure Category:** {cat_label}\n"
              f"- **HTTP Status:** `{http_status}`\n"
              f"- **Detail:** {fail_msg}\n\n"
              f"> This automated health check failure persisted on run [{run_id}]({run_url}).\n"
          )[:60000]

          with open('/tmp/issue_body.md', 'w', encoding='utf-8') as f:
              f.write(issue_body)

          with open('/tmp/comment_body.md', 'w', encoding='utf-8') as f:
              f.write(comment_body)
          EOF

          # Check for existing open alert issue with exact title match
          EXISTING_ISSUE=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --limit 100 \
            --json number,title 2>/dev/null \
            | jq -r --arg t "$ISSUE_TITLE" '.[] | select(.title == $t) | .number' 2>/dev/null \
            | head -n 1 || true)

          if [ -z "$EXISTING_ISSUE" ] || [ "$EXISTING_ISSUE" = "null" ]; then
            echo "No existing open issue found. Creating new alert issue..."
            gh label create alert \
              --repo "$REPO" \
              --color B60205 \
              --description "Automated gate failure needing a human" 2>/dev/null \
              || echo "label 'alert' already exists (or cannot be created); continuing"

            gh issue create \
              --repo "$REPO" \
              --title "$ISSUE_TITLE" \
              --body-file /tmp/issue_body.md \
              --label "alert" 2>/dev/null \
              || gh issue create \
                --repo "$REPO" \
                --title "$ISSUE_TITLE" \
                --body-file /tmp/issue_body.md
          else
            echo "Existing open issue found (#$EXISTING_ISSUE). Updating with a comment instead of creating duplicate..."
            gh issue comment "$EXISTING_ISSUE" \
              --repo "$REPO" \
              --body-file /tmp/comment_body.md \
              || echo "::warning::failed to add comment to issue #$EXISTING_ISSUE"
          fi
