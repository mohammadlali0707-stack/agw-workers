name: One-off -- set N8N_WEBHOOK_SECRET variable in n8n
on:
  workflow_dispatch:
jobs:
  set-var:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
    steps:
      - name: Create or update N8N_WEBHOOK_SECRET in n8n Variables
        run: |
          set -e
          echo "Calling n8n Variables API..."
          RESP=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://n8n.airboxvip.top/api/v1/variables" \
            -H "X-N8N-API-KEY: $N8N_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"N8N_WEBHOOK_SECRET\",\"value\":\"$N8N_WEBHOOK_SECRET\",\"type\":\"string\"}")
          echo "HTTP: $RESP"
          cat /tmp/resp.json
          if [ "$RESP" = "200" ] || [ "$RESP" = "201" ]; then
            echo "SUCCESS: N8N_WEBHOOK_SECRET set in n8n"
          elif [ "$RESP" = "409" ]; then
            echo "Already exists - getting ID to update..."
            LIST=$(curl -s "https://n8n.airboxvip.top/api/v1/variables" -H "X-N8N-API-KEY: $N8N_API_KEY")
            VAR_ID=$(echo "$LIST" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((v['id'] for v in d.get('data',[]) if v.get('key')=='N8N_WEBHOOK_SECRET'),''))")
            if [ -n "$VAR_ID" ]; then
              curl -s -X PATCH "https://n8n.airboxvip.top/api/v1/variables/$VAR_ID" \
                -H "X-N8N-API-KEY: $N8N_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"value\":\"$N8N_WEBHOOK_SECRET\"}"
              echo "UPDATED"
            fi
          else
            echo "::error::n8n API returned HTTP $RESP"
            exit 1
          fi
