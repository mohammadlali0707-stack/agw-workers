name: One-off -- probe whether a self-hosted runner picks up a job here (agw-workers)

# Control test for the same probe on Claud-Cloud-Project: this repo is
# where the Arvan self-hosted pool is known to have been used historically
# (agw-worker.yml's own runs-on conditional). If THIS also sits queued,
# the pool has no live runner for ACC6 at all right now, regardless of
# repo. If this picks up quickly while CCP's probe does not, the pool is
# up but not registered against Claud-Cloud-Project specifically.
#
# Read-only, does nothing but prove liveness.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: If this step ever runs, a self-hosted runner picked up a job from THIS repo
        run: |
          echo "Self-hosted runner accepted a job from agw-workers."
          hostname
          date -u
          whoami
