name: Profile sample upload

# Uploads one portfolio sample to a freelance profile (ParsCoders / KarLancer).
# Same job/result pattern as site-proposal.yml: the caller puts a job in
# hq-ai-results, dispatches this workflow with a job_id, and reads
# jobs/<job_id>/result.json back. Run mode=probe FIRST on a new site/profile:
# the exact portfolio form is unverified until probe reports it.

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'parscoders or karlancer'
        required: true
        type: string
      sample_url:
        description: 'Public URL of the sample (e.g. the hq-ai-results raw URL)'
        required: true
        type: string
      title:
        description: 'Sample title (Persian)'
        required: true
        type: string
      description:
        description: 'Sample description (Persian)'
        required: false
        type: string
        default: ''
      skills:
        description: 'Comma-separated skill names from the lead (matched against the live option list; falls back to the user''s own core skills)'
        required: false
        type: string
        default: ''
      mode:
        description: 'probe (find the form, submit nothing), inspect, attach-test (attach a real image and verify the form reveals + publish enables, submit nothing) or upload'
        required: true
        type: string
        default: 'probe'
      screenshot:
        description: 'Optional repo-relative path of a PNG to attach as the sample image (attach-test / upload); else the sample URL is screenshotted'
        required: false
        type: string
        default: ''
      job_id:
        description: 'Job id, e.g. up-par-20261116-xxxx'
        required: true
        type: string
      profile_url:
        description: 'Optional direct profile/portfolio URL (else discovered from home)'
        required: false
        type: string
        default: ''
      service_title:
        description: 'Karlancer service-create only: short service title (max 30 chars); defaults to title truncated to 30 chars'
        required: false
        type: string
        default: ''
      price:
        description: 'Karlancer service-create only: service price in Toman'
        required: false
        type: string
        default: '9000000'
      delivery_days:
        description: 'Karlancer service-create only: delivery time in days'
        required: false
        type: string
        default: '7'

permissions:
  contents: read

jobs:
  profile-sample-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout agw-workers
        uses: actions/checkout@v4

      - name: Checkout hq-ai-results
        uses: actions/checkout@v4
        with:
          repository: mohammadlali0707-stack/hq-ai-results
          token: ${{ secrets.ACC6_PAT }}
          path: hq-ai-results

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run sample uploader
        env:
          SITE_SESSIONS: ${{ secrets.SITE_SESSIONS }}
          SITE_SESSION_KARLANCER: ${{ secrets.SITE_SESSION_KARLANCER }}
          SITE_SESSION_PARSCODERS: ${{ secrets.SITE_SESSION_PARSCODERS }}
          PYTHONPATH: .
          # Workflow inputs via step-level env (never inline ${{ inputs.* }} in a
          # run: body — the YAML lint gate rejects those as untrusted expressions).
          SITE_INPUT: ${{ inputs.site }}
          SAMPLE_URL_INPUT: ${{ inputs.sample_url }}
          TITLE_INPUT: ${{ inputs.title }}
          DESCRIPTION_INPUT: ${{ inputs.description }}
          SKILLS_INPUT: ${{ inputs.skills }}
          MODE_INPUT: ${{ inputs.mode }}
          JOB_ID_INPUT: ${{ inputs.job_id }}
          PROFILE_URL_INPUT: ${{ inputs.profile_url }}
          SCREENSHOT_INPUT: ${{ inputs.screenshot }}
          SERVICE_TITLE_INPUT: ${{ inputs.service_title }}
          PRICE_INPUT: ${{ inputs.price }}
          DELIVERY_DAYS_INPUT: ${{ inputs.delivery_days }}
        run: |
          python3 -m scripts.site_proposal.upload_sample \
            --site "$SITE_INPUT" \
            --sample-url "$SAMPLE_URL_INPUT" \
            --title "$TITLE_INPUT" \
            --description "$DESCRIPTION_INPUT" \
            --skills "$SKILLS_INPUT" \
            --mode "$MODE_INPUT" \
            --job-id "$JOB_ID_INPUT" \
            --results-dir hq-ai-results \
            --profile-url "$PROFILE_URL_INPUT" \
            --screenshot "$SCREENSHOT_INPUT" \
            --service-title "$SERVICE_TITLE_INPUT" \
            --price "$PRICE_INPUT" \
            --delivery-days "$DELIVERY_DAYS_INPUT"

      - name: Commit and push results
        if: always()
        env:
          SITE_INPUT: ${{ inputs.site }}
          JOB_ID_INPUT: ${{ inputs.job_id }}
        run: |
          cd hq-ai-results
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d "jobs/$JOB_ID_INPUT" ] && git add "jobs/$JOB_ID_INPUT"
          if git diff --staged --quiet; then
            echo "No changes to commit in hq-ai-results."
            exit 0
          fi
          git commit -m "profile-sample-upload: $SITE_INPUT job $JOB_ID_INPUT [skip ci]"
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i of $MAX_RETRIES..."
            # Clear any conflicted rebase left by a previous attempt, or the
            # next pull dies with "unmerged files". -X theirs resolves a
            # same-path add/add (e.g. a retried job id) in favour of this run.
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "Successfully pushed results to hq-ai-results."
              exit 0
            fi
            sleep $((i * 2))
          done
          echo "Failed to push results to hq-ai-results after $MAX_RETRIES attempts."
          exit 1
