name: google-login-check
# owner 2026-10-30: verifies the shared Google site-login session (secret GOOGLE_SITE_COOKIES) still works.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'mohammadlali0707-stack/agw-workers'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Check accounts
        env:
          GOOGLE_SITE_COOKIES: ${{ secrets.GOOGLE_SITE_COOKIES }}
          GOOGLE_LOCK_TOKEN: ${{ secrets.ACC6_PAT }}
        run: |
          python - <<'PY'
          import sys, re; sys.path.insert(0, "tools"); import google_login
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            with google_login.session("google-login-check") as gl:
              b = p.chromium.launch(); ctx = b.new_context(storage_state=gl.storage_state())
              pg = ctx.new_page(); pg.goto("https://accounts.google.com/AccountChooser?hl=en", timeout=60000); pg.wait_for_timeout(3000)
              emails = set(re.findall(r"[a-z0-9.]+@gmail\.com", pg.content()))
              print("signed in:", gl.account in emails, "| other accounts in session:", len(emails - {gl.account}))
              pg.goto("https://myaccount.google.com/?hl=en", timeout=60000); ok = "myaccount.google.com" in pg.url; print("myaccount ok:", ok)
              b.close()
            sys.exit(0 if ok and gl.account in emails else 1)
          PY
