name: TBS Godot 3D stages 2 and 3 assets

on:
  workflow_dispatch:
  repository_dispatch:
    types: [notion-task]

permissions:
  contents: read

jobs:
  build-assets:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.page_id == 'tbs-godot3d-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SKETCHFAB_API_TOKEN: ${{ secrets.SKETCHFAB_API_TOKEN }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      FREESOUND_CLIENT_ID: ${{ secrets.FREESOUND_CLIENT_ID }}
      FREESOUND_CLIENT_SECRET: ${{ secrets.FREESOUND_CLIENT_SECRET }}
      ASSET_OUT: ${{ github.workspace }}/out/licensed-assets
    steps:
      - name: Check out private game repository
        uses: actions/checkout@v5
        with:
          repository: mohammadlali0707-stack/Claud-Cloud-Project
          token: ${{ secrets.ACC6_PAT }}
          ref: main
          fetch-depth: 0
          path: ccp

      - name: Install Blender and download Quaternius CC0 library
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender curl python3-numpy
          mkdir -p source out/kaveh
          curl --retry 4 --retry-all-errors -fsSL -o source/AnimationLibrary_Godot_Standard.gltf https://raw.githubusercontent.com/J-Ponzo/gltf-universal-animation-library/main/glTF/AnimationLibrary_Godot_Standard.gltf
          curl --retry 4 --retry-all-errors -fsSL -o source/AnimationLibrary_Godot_Standard.bin https://raw.githubusercontent.com/J-Ponzo/gltf-universal-animation-library/main/glTF/AnimationLibrary_Godot_Standard.bin

      - name: Build rigged Kaveh GLB with Idle Walk Run
        shell: bash
        run: |
          set +e
          set -uo pipefail
          blender --background --python ccp/godot3d/tools/build_kaveh.py -- "$GITHUB_WORKSPACE/source/AnimationLibrary_Godot_Standard.gltf" "$GITHUB_WORKSPACE/out/kaveh/Soldier.glb" 2>&1 | tee out/kaveh-build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ] || [ ! -s out/kaveh/Soldier.glb ] || ! grep -q 'KAVEH_OK' out/kaveh-build.log; then
            message=$(tail -35 out/kaveh-build.log | cut -c1-3200)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=Kaveh Blender build failed::$message"
            exit 1
          fi

      - name: Fetch Sketchfab CC0 or CC-BY props and Freesound CC0 ambience
        shell: bash
        run: |
          set -euo pipefail
          python3 ccp/godot3d/tools/fetch_cc_assets.py
          test -s out/licensed-assets/CREDITS.md

      - name: Commit attribution text only
        shell: bash
        working-directory: ccp
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/out/licensed-assets/CREDITS.md" godot3d/CREDITS.md
          git config user.name tbs-asset-ci
          git config user.email tbs-asset-ci@users.noreply.github.com
          if ! git diff --quiet -- godot3d/CREDITS.md; then
            git add godot3d/CREDITS.md
            git commit -m "docs(godot3d): record licensed prop and audio credits"
            git push origin HEAD:main
          fi

      - name: Upload Kaveh and licensed asset pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbs-godot3d-free-assets-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 14
