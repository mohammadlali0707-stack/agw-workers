name: AGY Account Lead (plan + dispatch up to 10 subordinates, collect, aggregate)

# Dispatched once per account by agy-plan-dispatch.yml (never triggered by
# an issue event directly). This is the "account lead" tier the owner
# asked for: bot #1 (w01) of the given account.
#
# 1. Runs agy AS this account's own identity to break package_goal into up
#    to 10 tasks -- a CEILING, not a quota -- one per subordinate member (w02-w11 per Team/
#    org.json -- w01 itself is the lead and does not get a worker task).
# 2. Dispatches agw-worker.yml once per task, same account identity,
#    5 SECONDS APART (the owner's own anti-rate-limit design -- these
#    calls share the lead's own Antigravity quota), each writing its
#    report under Reports/agy/acc<N>/ in target_repo (report_dir input).
# 3. Polls target_repo (git pull in a loop, not the API, to stay cheap)
#    until all dispatched reports exist or a time budget runs out.
# 4. Runs agy once more (same identity) to write ONE Persian account-level
#    summary from the collected reports, commits it to
#    Reports/agy/team_reports/acc<N>.md.
# 5. Checks whether every account named in all_accounts now has a team
#    report. If so, race-safely (via a git push that only one lead can
#    win) dispatches agy-final-report.yml -- the ACC6 bot that reads all
#    team reports and posts the comprehensive summary issue.

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Account index 0-8 (never 6 or 9) this lead plans and dispatches for'
        required: true
        type: string
      package_goal:
        description: 'The scope of work this account''s lead should break down among its subordinates (up to 10; fewer is correct when the work is smaller)'
        required: true
        type: string
      target_repo:
        description: 'owner/repo the whole plan is targeting'
        required: true
        type: string
      issue_number:
        description: 'Issue to post progress comments to'
        required: false
        default: ''
        type: string
      callback_id:
        description: 'Base tag for this account''s dispatches, e.g. plan-11-acc3'
        required: false
        default: ''
        type: string
      all_accounts:
        description: 'JSON array of every account in this proposal (e.g. [0,1,3]) -- used to detect "am I the last lead to finish" for the final-report trigger'
        required: false
        default: '[]'
        type: string
      agy_token_b64:
        description: 'CROSS-ACCOUNT MODE: this account''s own base64 Antigravity token, supplied by agy-plan-dispatch.yml when cross-dispatching this lead to run inside its own account''s copy of this repo (where the local secrets.AGW_TOKEN_ACC* below do not exist). Empty = look it up locally, the same-repo/legacy behavior.'
        required: false
        default: ''
        type: string
      target_repo_pat:
        description: 'CROSS-ACCOUNT MODE: PAT to check out/push target_repo, supplied by the caller instead of looking one up locally (which also does not exist outside ACC6). Empty = resolve locally the original way.'
        required: false
        default: ''
        type: string
      control_repo:
        description: 'The repo hosting the planning issue and agy-final-report.yml -- always mohammadlali0707-stack/agw-workers, kept as an input rather than hardcoded since this file itself is deployed byte-identical to every account.'
        required: false
        default: 'mohammadlali0707-stack/agw-workers'
        type: string
      control_repo_pat:
        description: 'CROSS-ACCOUNT MODE: PAT with write access to control_repo, needed when this job runs inside a DIFFERENT account''s own repo (its local default GITHUB_TOKEN only reaches that repo, not control_repo). Empty = use this job''s own default token, correct when control_repo IS the repo this job is running in (same-repo/legacy mode).'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  lead:
    runs-on: ${{ github.repository_owner == 'Mohammadlali' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      # Unique per job execution. /tmp/agent-repo was a single shared path:
      # it survived between jobs (which is why a `rm -rf` was added on
      # 2026-09-17), and `rm -rf` on a SHARED path is only safe when jobs run
      # one at a time. They do not -- agy-lead-plan dispatches 10 agw-worker
      # runs 5s apart, so two on one host would delete each other's checkout
      # mid-clone. That failure is silent, unlike the dir-exists error it
      # replaced. runner.temp is per-runner and the run/attempt/job triple
      # makes it unique even if the temp dir is ever shared.
      # AGENT_REPO is set by the setup step below (runner context is not
      # available in job-level env blocks -- only in step-level contexts).
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONTROL_REPO: ${{ inputs.control_repo }}
      # Used only by the steps that talk to control_repo (issue comments,
      # the final-report trigger) -- everything else (subordinate dispatch)
      # keeps using the job-level GH_TOKEN above, which is correctly scoped
      # to whichever repo this job itself is running in.
      CONTROL_GH_TOKEN: ${{ inputs.control_repo_pat != '' && inputs.control_repo_pat || secrets.GITHUB_TOKEN }}
      ACCOUNT: ${{ inputs.account }}
      TARGET_REPO: ${{ inputs.target_repo }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      BASE_TAG: ${{ inputs.callback_id }}
    steps:
      # Needed for Tools/agy_checklist.py. This job did not check out its own
      # repo before, because everything it used lived in the workflow file.
      - uses: actions/checkout@v4

      - name: Ack on the issue
        if: env.ISSUE_NUMBER != ''
        env:
          GH_TOKEN: ${{ env.CONTROL_GH_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$CONTROL_REPO" \
            --body "Account ${ACCOUNT} lead: در حال تدوین تسک‌های ۱۰ زیردست..."

      - name: Install AGY CLI from HF Dataset
        run: |
          curl -L \
            "https://huggingface.co/datasets/stranger777777/agw-cli-bin/resolve/main/cli_linux_x64.tar.gz" \
            -o /tmp/cli.tar.gz
          mkdir -p /tmp/agx
          tar -xzf /tmp/cli.tar.gz -C /tmp/agx
          CLI_BIN=$(find /tmp/agx -type f \( -name "antigravity" -o -name "agy" \) | head -1)
          if [ -z "$CLI_BIN" ]; then
            CLI_BIN=$(find /tmp/agx -type f -executable | head -1)
          fi
          # Install without sudo. Ephemeral runners are fresh containers and do
          # not inherit /etc/sudoers.d/runner from the Arvan host, so
          # `sudo install` dies with "sudo: a password is required" -- measured
          # 2026-09-17T09:58:21Z in job 105158016308, after the sudoers fix was
          # believed to be in place. A user-writable dir added to $GITHUB_PATH
          # needs no privilege and behaves identically on self-hosted and on
          # ubuntu-latest, so this no longer depends on the runner image.
          AGY_BIN_DIR="${RUNNER_TEMP:-/tmp}/agy-bin"
          mkdir -p "$AGY_BIN_DIR"
          install -m 0755 "$CLI_BIN" "$AGY_BIN_DIR/agy"
          # $GITHUB_PATH only affects LATER steps, so export for this one too.
          echo "$AGY_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$AGY_BIN_DIR:$PATH"
          agy --version 2>/dev/null || echo "agy ready"

      # Same case statement as agw-worker.yml's own "Checkout target repo"
      # step -- kept in sync deliberately, not sourced from one place,
      # since GitHub Actions has no shared-step-library mechanism here.
      - name: Set unique AGENT_REPO path
        run: |
          echo "AGENT_REPO=${RUNNER_TEMP}/agent-repo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-propose" >> "$GITHUB_ENV"

      - name: Checkout target repo (kept open for the whole job -- planning, polling and two commits all reuse it)
        id: checkout_target
        env:
          TARGET_REPO_PAT_INPUT: ${{ inputs.target_repo_pat }}
          ACC0_PAT: ${{ secrets.ACC0_PAT }}
          ACC6_PAT: ${{ secrets.ACC6_PAT }}
        run: |
          set -e
          if [ -n "$TARGET_REPO_PAT_INPUT" ]; then
            echo "::add-mask::$TARGET_REPO_PAT_INPUT"
            TOKEN="$TARGET_REPO_PAT_INPUT"
          else
            case "$TARGET_REPO" in
              Mohammadlali/agw-workers) TOKEN="$ACC0_PAT" ;;
              *) TOKEN="$ACC6_PAT" ;;
            esac
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::No token wired for $TARGET_REPO"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_HEADER"
          echo "auth_header=$AUTH_HEADER" >> "$GITHUB_OUTPUT"
          rm -rf "${AGENT_REPO}"
          mkdir -p "${AGENT_REPO}"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" clone \
            "https://github.com/${TARGET_REPO}.git" "${AGENT_REPO}"
          git -C "${AGENT_REPO}" config user.email "agy-bot@claud-cloud.local"
          git -C "${AGENT_REPO}" config user.name "AGY Bot"
          echo "branch=$(git -C "${AGENT_REPO}" symbolic-ref --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore this account's own AGY identity
        env:
          AGY_TOKEN_INPUT: ${{ inputs.agy_token_b64 }}
          T0: ${{ secrets.AGW_TOKEN_ACC0 }}
          T1: ${{ secrets.AGW_TOKEN_ACC1 }}
          T2: ${{ secrets.AGW_TOKEN_ACC2 }}
          T3: ${{ secrets.AGW_TOKEN_ACC3 }}
          T4: ${{ secrets.AGW_TOKEN_ACC4 }}
          T5: ${{ secrets.AGW_TOKEN_ACC5 }}
          T7: ${{ secrets.AGW_TOKEN_ACC7 }}
          T8: ${{ secrets.AGW_TOKEN_ACC8 }}
        run: |
          set -e
          mkdir -p ~/.gemini/antigravity-cli ~/.gemini/config
          if [ -n "$AGY_TOKEN_INPUT" ]; then
            TOKEN_B64="$AGY_TOKEN_INPUT"
          else
            case "$ACCOUNT" in
              0) TOKEN_B64="$T0" ;;
              1) TOKEN_B64="$T1" ;;
              2) TOKEN_B64="$T2" ;;
              3) TOKEN_B64="$T3" ;;
              4) TOKEN_B64="$T4" ;;
              5) TOKEN_B64="$T5" ;;
              7) TOKEN_B64="$T7" ;;
              8) TOKEN_B64="$T8" ;;
              *) echo "::error::account=$ACCOUNT has no wired identity (6 and 9 are never leads)"; exit 1 ;;
            esac
          fi
          echo "$TOKEN_B64" | base64 -d > ~/.gemini/antigravity-cli/antigravity-oauth-token
          chmod 600 ~/.gemini/antigravity-cli/antigravity-oauth-token
          cat /proc/sys/kernel/random/uuid > ~/.gemini/antigravity-cli/installation_id
          echo '{"userSettings":{}}' > ~/.gemini/config/config.json

      - name: Build the lead-planning prompt
        id: prompt
        env:
          PACKAGE_GOAL: ${{ inputs.package_goal }}
        run: |
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          SAFE_GOAL=$(printf '%s' "$PACKAGE_GOAL" | sanitize)
          {
            printf '%s\n' "You are agw-ACC${ACCOUNT}-w01, the LEAD of account ${ACCOUNT} on this fleet. This is a PLANNING request only -- do not write, edit, commit or dispatch anything yourself."
            printf '\nYOUR PACKAGE (the scope your team owns):\n%s\n' "$SAFE_GOAL"
            printf '\nDo this, in order:\n'
            printf '%s\n' '1. Read Team/org.json in this checked-out repo. Find the "members" entries whose "account" is your own account number and whose "role" is NOT "lead" -- those are your 10 subordinates (w02..w11). Note each one'"'"'s id, title, and guild.'
            printf '%s\n' '2. Read Team/MAP.md'"'"'s CURRENT STATE block for what is already done or in progress, so you do not propose duplicate work.'
            printf '%s\n' '3. Break YOUR PACKAGE into as many concrete tasks as the work genuinely contains -- one per subordinate whose title/guild is a real fit. TEN IS A CEILING, NOT A TARGET: if the package is honestly three tasks, produce three. Do not pad, do not split one piece of work in half to reach a number, and do not invent busywork for a subordinate whose guild has nothing to do here. A short, real list beats a full, padded one. Never invent a member_id, never assign two tasks to the same member_id.'
            printf '\n%s\n' '4. Output your ENTIRE response as exactly two parts, nothing else:'
            printf '%s\n' '   a) A short Persian paragraph (2-4 sentences) summarizing your plan.'
            printf '%s\n' '   b) Then ONE fenced code block, language json, containing ONLY valid JSON with exactly this shape:'
            printf '%s\n' "{\"kind\":\"tbs_lead_task_list\",\"account\":${ACCOUNT},\"tasks\":[{\"member_id\":\"<org.json id>\",\"title\":\"<short task title>\",\"task\":\"<the exact, complete instruction this one subordinate should carry out>\"}]}"
            printf '%s\n' 'Do not include a trailing @agy/@agy-plan marker -- this is a proposal, not a new request.'
          } > /tmp/plan_prompt.txt

      - name: Run AGY in lead-planning mode
        run: |
          set +e
          cd "${AGENT_REPO}"
          PROMPT=$(cat /tmp/plan_prompt.txt)
          OUTPUT=$(timeout 1700 agy --dangerously-skip-permissions --print-timeout 1680s -p "$PROMPT" 2>&1)
          AGY_RC=$?
          echo "$OUTPUT" > /tmp/lead_plan_output.txt
          # Record agy's exit code. Without it every agy-level failure (quota,
          # auth, timeout, network) reaches the parser as "no JSON here" and
          # gets reported as a malformed proposal. Run 34934947183 was exactly
          # that: agy printed one line, "Individual quota reached", and the
          # issue comment blamed the JSON contract. 124 is timeout(1)'s code.
          echo "$AGY_RC" > /tmp/agy_rc.txt
          echo "Lead plan output lines: $(wc -l < /tmp/lead_plan_output.txt)  (agy exit=$AGY_RC)"
          echo "----- agy output (first 80 lines) -----"
          head -n 80 /tmp/lead_plan_output.txt
          echo "----- end -----"

      - name: Parse the lead's task list
        id: parse
        run: |
          set -e
          python3 - <<'PYEOF'
          import json, os, re, sys
          account = os.environ['ACCOUNT']
          text = open('/tmp/lead_plan_output.txt', encoding='utf-8').read()

          # Classify an agy-level failure BEFORE blaming the JSON contract.
          # "agy could not run" and "agy ran but wrote bad JSON" need different
          # answers: the first is a quota/credential/timeout problem nobody can
          # fix by editing the prompt. Reporting both as "the proposal did not
          # parse" is what made run 34934947183 look like a schema bug when the
          # real output was one line: "Individual quota reached."
          try:
              rc = int(open('/tmp/agy_rc.txt').read().strip())
          except Exception:
              rc = 0
          low = text.lower()
          reason = None
          if 'quota reached' in low or 'upgrade your subscription' in low:
              reason = ('AGY_QUOTA',
                        'سهمیه‌ی این اکانت تمام شده است. تا ریست شدن سهمیه، '
                        'برنامه‌ریزی این اکانت اجرا نمی‌شود.')
          elif rc == 124:
              reason = ('AGY_TIMEOUT',
                        'اجرای agy به سقف زمانی رسید و قطع شد.')
          elif ('authentication' in low or 'unauthorized' in low
                or 'invalid api key' in low or 'not logged in' in low):
              reason = ('AGY_AUTH',
                        'احراز هویت agy برای این اکانت شکست خورد (توکن نامعتبر یا منقضی).')
          elif not text.strip():
              reason = ('AGY_EMPTY', 'agy هیچ خروجی‌ای تولید نکرد.')
          elif rc != 0:
              reason = ('AGY_FAILED',
                        'agy با کد خطای {0} خارج شد.'.format(rc))

          if reason is not None:
              code, persian = reason
              print(code, file=sys.stderr)
              print(text.strip()[:400], file=sys.stderr)
              with open('/tmp/lead_fail_reason.txt', 'w', encoding='utf-8') as f:
                  f.write(persian)
              sys.exit(1)

          blocks = re.findall(r'```json\s*(.*?)```', text, re.DOTALL)
          plan = None
          for b in blocks:
              try:
                  obj = json.loads(b)
              except Exception:
                  continue
              if obj.get('kind') == 'tbs_lead_task_list':
                  plan = obj
          if plan is None:
              # agy ran fine and exited 0, so this really is a contract failure.
              print('NO_LEAD_PLAN_FOUND', file=sys.stderr)
              print('agy exited 0 with {0} json block(s), none of kind '
                    'tbs_lead_task_list'.format(len(blocks)), file=sys.stderr)
              with open('/tmp/lead_fail_reason.txt', 'w', encoding='utf-8') as f:
                  f.write('agy اجرا شد ولی خروجی‌اش بلوک JSON معتبر با '
                          'kind=tbs_lead_task_list نداشت ({0} بلوک JSON دیده شد).'
                          .format(len(blocks)))
              sys.exit(1)
          tasks = plan.get('tasks', [])
          os.makedirs('/tmp/subtasks', exist_ok=True)
          for i, t in enumerate(tasks):
              member = t.get('member_id') or 'unknown'
              title = t.get('title', 'task')
              body = t.get('task', '')
              prompt = 'You are {0}, working under account {1}\'s lead. TASK: {2}\n{3}'.format(member, account, title, body)
              with open('/tmp/subtasks/{0}.txt'.format(i), 'w', encoding='utf-8') as f:
                  f.write(prompt)
              with open('/tmp/subtasks/{0}.meta'.format(i), 'w', encoding='utf-8') as f:
                  f.write(title + '\t' + member)
          with open('/tmp/subtask_count.txt', 'w') as f:
              f.write(str(len(tasks)))
          print('{0} subordinate task(s) parsed'.format(len(tasks)))
          PYEOF
          echo "count=$(cat /tmp/subtask_count.txt)" >> "$GITHUB_OUTPUT"

      - name: If planning failed, report the real reason and stop here (do not leave the issue silent)
        if: failure()
        env:
          GH_TOKEN: ${{ env.CONTROL_GH_TOKEN }}
        run: |
          # Report what actually went wrong. The old text said "پروپوزال پارس نشد"
          # for every failure including a quota wall, which sent one
          # investigation at the prompt and the JSON schema when neither was
          # involved. Fall back to the generic wording only if the parse step
          # died before it could classify.
          if [ -s /tmp/lead_fail_reason.txt ]; then
            REASON=$(cat /tmp/lead_fail_reason.txt)
          else
            REASON="برنامه‌ریزی lead پیش از طبقه‌بندی خطا متوقف شد؛ لاگ ران را ببینید."
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Build the body with printf rather than a literal multi-line string:
          # continuation lines would sit at column 0 and terminate this YAML
          # block scalar, which is a parse error, not a bash one.
          BODY=$(printf '%s\n\n%s\n\n%s' \
            "Account ${ACCOUNT} lead: متوقف شد." "${REASON}" "لاگ: ${RUN_URL}")
          gh issue comment "$ISSUE_NUMBER" --repo "$CONTROL_REPO" --body "$BODY" || true

      # Owner's request 2026-09-17: post the plan BEFORE doing the work, as
      # a list that fills in as each part lands -- rather than going silent
      # for ten minutes and then emitting one wall of output. The tags are
      # computed with the same formula the dispatch loop below uses; they are
      # what each subordinate stamps its result with, and what the checklist
      # is re-derived from. Kept deliberately in step with that loop.
      - name: Post the plan as a live checklist before any work starts
        if: always() && steps.parse.outputs.count != ''
        env:
          GH_TOKEN: ${{ env.CONTROL_GH_TOKEN }}
        run: |
          set +e
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "no issue to post a checklist on"
            exit 0
          fi
          COUNT=$(cat /tmp/subtask_count.txt)
          : > /tmp/checklist.tsv
          for i in $(seq 0 $((COUNT - 1))); do
            META=$(cat "/tmp/subtasks/${i}.meta")
            TITLE="${META%%$'\t'*}"
            MEMBER="${META##*$'\t'}"
            TAG="${BASE_TAG}-w$(printf '%02d' $((i + 2)))"
            printf '%s\t%s\t%s\n' "$TAG" "$TITLE" "$MEMBER" >> /tmp/checklist.tsv
          done
          python3 "$GITHUB_WORKSPACE/Tools/agy_checklist.py" post \
            --repo "$CONTROL_REPO" --issue "$ISSUE_NUMBER" \
            --marker "<!-- agy-checklist:${BASE_TAG} -->" \
            --title "نقشه‌ی کار اکانت ${ACCOUNT}" \
            --tasks /tmp/checklist.tsv

      - name: Dispatch the planned subordinates, 5 seconds apart
        id: dispatch
        env:
          AGY_TOKEN_INPUT: ${{ inputs.agy_token_b64 }}
          TARGET_REPO_PAT: ${{ steps.checkout_target.outputs.token }}
        run: |
          set -e
          COUNT=$(cat /tmp/subtask_count.txt)
          REPORT_DIR="acc${ACCOUNT}"
          for i in $(seq 0 $((COUNT - 1))); do
            PROMPT=$(cat "/tmp/subtasks/${i}.txt")
            META=$(cat "/tmp/subtasks/${i}.meta")
            TITLE="${META%%$'\t'*}"
            MEMBER="${META##*$'\t'}"
            TAG="${BASE_TAG}-w$(printf '%02d' $((i + 2)))"
            echo "Dispatching $((i + 1))/$COUNT for account ${ACCOUNT}: $TITLE ($MEMBER) tag=$TAG"
            # This job may itself be running inside this account's OWN copy
            # of the repo (cross-dispatched by agy-plan-dispatch.yml) --
            # github.repository already resolves to the right place either
            # way, so subordinates land in the same repo/account as their
            # lead. agy_token_b64/target_repo_pat pass the same cross-
            # account credentials through (empty in same-repo/legacy mode,
            # where a subordinate just does its own local lookup as before).
            gh workflow run agw-worker.yml \
              --repo "${{ github.repository }}" \
              --field "prompt=$PROMPT" \
              --field "target_repo=$TARGET_REPO" \
              --field "target_branch=" \
              --field "acc_index=${ACCOUNT}" \
              --field "report_dir=$REPORT_DIR" \
              --field "callback_id=$TAG" \
              --field "agy_token_b64=$AGY_TOKEN_INPUT" \
              --field "target_repo_pat=$TARGET_REPO_PAT"
            echo "$TAG" >> /tmp/expected_tags.txt
            if [ "$i" -lt "$((COUNT - 1))" ]; then
              sleep 5
            fi
          done
          echo "expected=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Poll target_repo for all subordinate reports (git pull, not the API -- cheap and reuses the same clone)
        id: poll
        env:
          AUTH_HEADER: ${{ steps.checkout_target.outputs.auth_header }}
          BRANCH: ${{ steps.checkout_target.outputs.branch }}
        run: |
          set +e
          EXPECTED="${{ steps.dispatch.outputs.expected }}"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" = "0" ]; then
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "No subordinates were dispatched -- nothing to poll for."
            exit 0
          fi
          DEADLINE=$(( $(date +%s) + 40*60 ))
          FOUND=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            cd "${AGENT_REPO}"
            git -c http.https://github.com/.extraHeader="$AUTH_HEADER" pull origin "$BRANCH" --quiet
            FOUND=0
            : > /tmp/found_reports.txt
            while read -r TAG; do
              F="Reports/agy/acc${ACCOUNT}/${TAG}.txt"
              if [ -f "$F" ]; then
                FOUND=$((FOUND + 1))
                echo "$F" >> /tmp/found_reports.txt
              fi
            done < /tmp/expected_tags.txt
            echo "Poll: ${FOUND}/${EXPECTED} subordinate reports present."
            if [ "$FOUND" -ge "$EXPECTED" ]; then
              break
            fi
            sleep 30
          done
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Build and run the account-summary prompt
        run: |
          set +e
          cd "${AGENT_REPO}"
          {
            printf '%s\n' "You are agw-ACC${ACCOUNT}-w01, the lead of account ${ACCOUNT}. Your ${{ steps.poll.outputs.found }} subordinate(s) (of ${{ steps.dispatch.outputs.expected }} dispatched) reported back. Below are their raw reports."
            printf '\n'
            if [ -s /tmp/found_reports.txt ]; then
              while read -r F; do
                printf -- '--- %s ---\n' "$F"
                cat "$F" 2>/dev/null
                printf '\n'
              done < /tmp/found_reports.txt
            else
              printf '(no subordinate reports arrived within the poll window)\n'
            fi
            printf '\nWrite ONE comprehensive Persian summary (a few short paragraphs) of what your account accomplished, and note anything that failed or is still missing. This is your final report -- plain text, no JSON needed.\n'
          } > /tmp/summary_prompt.txt
          PROMPT=$(cat /tmp/summary_prompt.txt)
          OUTPUT=$(timeout 1700 agy --dangerously-skip-permissions --print-timeout 1680s -p "$PROMPT" 2>&1)
          echo "$OUTPUT" > /tmp/account_summary.txt

      - name: Commit the account-level team report
        id: commit_summary
        env:
          AUTH_HEADER: ${{ steps.checkout_target.outputs.auth_header }}
          BRANCH: ${{ steps.checkout_target.outputs.branch }}
        run: |
          set -e
          cd "${AGENT_REPO}"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" pull origin "$BRANCH" --quiet
          mkdir -p Reports/agy/team_reports
          cp /tmp/account_summary.txt "Reports/agy/team_reports/acc${ACCOUNT}.md"
          git add "Reports/agy/team_reports/acc${ACCOUNT}.md"
          if ! git diff --cached --quiet; then
            git commit -m "agy: account ${ACCOUNT} team report (${{ steps.poll.outputs.found }}/${{ steps.dispatch.outputs.expected }} subordinates reported)"
            git -c http.https://github.com/.extraHeader="$AUTH_HEADER" push origin "HEAD:$BRANCH"
          fi

      - name: Report to the issue
        if: env.ISSUE_NUMBER != ''
        env:
          GH_TOKEN: ${{ env.CONTROL_GH_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$CONTROL_REPO" \
            --body "Account ${ACCOUNT} lead: ${{ steps.poll.outputs.found }}/${{ steps.dispatch.outputs.expected }} زیردست گزارش دادند. خلاصه در \`Reports/agy/team_reports/acc${ACCOUNT}.md\` ثبت شد."

      - name: If I am the last account to finish, trigger the final ACC6 summary (race-safe via git push)
        env:
          AUTH_HEADER: ${{ steps.checkout_target.outputs.auth_header }}
          BRANCH: ${{ steps.checkout_target.outputs.branch }}
          ALL_ACCOUNTS: ${{ inputs.all_accounts }}
          GH_TOKEN: ${{ env.CONTROL_GH_TOKEN }}
        run: |
          set +e
          cd "${AGENT_REPO}"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" pull origin "$BRANCH" --quiet
          ALL_DONE=$(python3 - <<'PYEOF'
          import json, os
          accounts = json.loads(os.environ['ALL_ACCOUNTS'])
          missing = [a for a in accounts if not os.path.isfile('Reports/agy/team_reports/acc{}.md'.format(a))]
          print('yes' if not missing else 'no:' + ','.join(str(m) for m in missing))
          PYEOF
          )
          echo "All-accounts check: $ALL_DONE"
          if [ "$ALL_DONE" != "yes" ]; then
            echo "Not every account has reported yet -- not the last lead, nothing more to do."
            exit 0
          fi

          # Race guard: only the lead whose push of this marker actually
          # succeeds is "the last one" -- a second lead finishing in the
          # same window will find the marker already there and its own
          # push will fail (non-fast-forward), so it skips cleanly. This
          # is the same "git is the only channel" pattern the rest of this
          # fleet relies on, not a new mechanism.
          mkdir -p Reports/agy/team_reports
          MARKER="Reports/agy/team_reports/.final_dispatched_${ISSUE_NUMBER:-noissue}"
          if [ -f "$MARKER" ]; then
            echo "Marker already exists -- another lead already triggered the final report."
            exit 0
          fi
          echo "account ${ACCOUNT} triggered this at $(date -u +%FT%TZ)" > "$MARKER"
          git add "$MARKER"
          git commit -m "agy: final-report trigger marker (issue ${ISSUE_NUMBER:-unknown})"
          if git -c http.https://github.com/.extraHeader="$AUTH_HEADER" push origin "HEAD:$BRANCH"; then
            echo "Won the race -- dispatching agy-final-report.yml"
            gh workflow run agy-final-report.yml \
              --repo "$CONTROL_REPO" \
              --field "target_repo=$TARGET_REPO" \
              --field "issue_number=${ISSUE_NUMBER}" \
              --field "all_accounts=$ALL_ACCOUNTS"
          else
            echo "Push of the marker failed (another lead won the race) -- not dispatching."
          fi
