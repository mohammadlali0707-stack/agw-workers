name: HQ migrate secrets
run-name: hq migrate
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Copy own session + Xray config to each account repo
        env:
          XRAY_CONFIG: ${{ secrets.XRAY_CONFIG }}
          C0: ${{ secrets.GEMINI_WEB_COOKIES_ACC0 }}
          C2: ${{ secrets.GEMINI_WEB_COOKIES_ACC2 }}
          C4: ${{ secrets.GEMINI_WEB_COOKIES_ACC4 }}
          C5: ${{ secrets.GEMINI_WEB_COOKIES_ACC5 }}
          C8: ${{ secrets.GEMINI_WEB_COOKIES_ACC8 }}
          P0: ${{ secrets.ACC0_PAT }}
          P1: ${{ secrets.ACC1_PAT }}
          P2: ${{ secrets.ACC2_PAT }}
          P3: ${{ secrets.ACC3_PAT }}
          P4: ${{ secrets.ACC4_PAT }}
          P5: ${{ secrets.ACC5_PAT }}
          P7: ${{ secrets.ACC7_PAT }}
          P8: ${{ secrets.ACC8_PAT }}
        run: |
          pip install -q pynacl
          python3 - <<'PY'
          import os, json, base64, urllib.request
          from nacl import encoding, public
          L = {0:"Mohammadlali",1:"momonakikugava-pixel",2:"lali94m-max",3:"ngocgminh5-debug",4:"hmmletssee7-design",5:"kidding602",7:"mohammad97okk",8:"moradzahra85-png"}
          def put(a, name, val):
              H = {"Authorization": "Bearer " + os.environ[f"P{a}"], "Accept": "application/vnd.github+json"}
              repo = f"{L[a]}/agw-workers"
              k = json.load(urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/secrets/public-key", headers=H), timeout=60))
              enc = base64.b64encode(public.SealedBox(public.PublicKey(k["key"].encode(), encoding.Base64Encoder())).encrypt(val.encode())).decode()
              urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/secrets/{name}", data=json.dumps({"encrypted_value": enc, "key_id": k["key_id"]}).encode(), method="PUT", headers=H), timeout=60)
          for a in L:
              jobs = [("XRAY_CONFIG", os.environ["XRAY_CONFIG"])]
              if os.environ.get(f"C{a}"): jobs.append((f"GEMINI_WEB_COOKIES_ACC{a}", os.environ[f"C{a}"]))
              for n, v in jobs:
                  try: put(a, n, v); print(a, n, "ok")
                  except Exception as e: print(a, n, "FAIL", type(e).__name__, getattr(e, "code", ""))
          PY
