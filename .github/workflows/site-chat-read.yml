name: Site Chat Read

# Read-only: open one project's conversation on a freelance site with the
# saved site session and dump its messages as a workflow artifact.
# Never sends anything, never fills or submits a form, never spends tokens.
# NOTE: results are uploaded as an artifact (not pushed to hq-ai-results)
# because the HQ_RESULTS_TOKEN secret no longer exists in this repo
# (verified 2026-11-20); the checkout of hq-ai-results fails without it.

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Target freelancing platform'
        required: true
        type: choice
        options:
          - karlancer
          - parscoders
          - ponisha
      project_url:
        description: 'URL of the target project'
        required: true
        type: string
      project_title:
        description: 'Project title (used to find its bid row)'
        required: false
        type: string
        default: ''
      job_id:
        description: 'Unique job ID'
        required: true
        type: string
      contact:
        description: 'Contact name to open inside the messages hub (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  site-chat-read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Workflow inputs via env (never inline ${{ inputs.* }} in a run: body
      # — the YAML lint gate rejects those as untrusted expressions).
      SITE_INPUT: ${{ inputs.site }}
      PROJECT_URL_INPUT: ${{ inputs.project_url }}
      PROJECT_TITLE_INPUT: ${{ inputs.project_title }}
      JOB_ID_INPUT: ${{ inputs.job_id }}
      CONTACT_INPUT: ${{ inputs.contact }}

    steps:
      - name: Checkout agw-workers
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run chat reader (read-only)
        env:
          SITE_SESSIONS: ${{ secrets.SITE_SESSIONS }}
          SITE_SESSION_KARLANCER: ${{ secrets.SITE_SESSION_KARLANCER }}
          SITE_SESSION_PARSCODERS: ${{ secrets.SITE_SESSION_PARSCODERS }}
          SITE_SESSION_PONISHA: ${{ secrets.SITE_SESSION_PONISHA }}
          PYTHONPATH: .
        run: |
          python3 -m scripts.site_proposal.read_chat \
            --site "$SITE_INPUT" \
            --project-url "$PROJECT_URL_INPUT" \
            --project-title "$PROJECT_TITLE_INPUT" \
            --job-id "$JOB_ID_INPUT" \
            --contact "$CONTACT_INPUT" \
            --results-dir chat-results

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-${{ env.JOB_ID_INPUT }}
          path: chat-results/
          if-no-files-found: error
          retention-days: 30
