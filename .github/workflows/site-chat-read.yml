name: Site Chat Read

# Read-only: open one project's conversation on a freelance site with the
# saved site session and dump its messages to hq-ai-results. Never sends
# anything, never fills or submits a form, never spends tokens.

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Target freelancing platform'
        required: true
        type: choice
        options:
          - karlancer
          - parscoders
          - ponisha
      project_url:
        description: 'URL of the target project'
        required: true
        type: string
      project_title:
        description: 'Project title (used to find its bid row)'
        required: false
        type: string
        default: ''
      job_id:
        description: 'Unique job ID'
        required: true
        type: string

permissions:
  contents: read

jobs:
  site-chat-read:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout agw-workers
        uses: actions/checkout@v4

      - name: Checkout hq-ai-results
        uses: actions/checkout@v4
        with:
          repository: mohammadlali0707-stack/hq-ai-results
          token: ${{ secrets.HQ_RESULTS_TOKEN }}
          path: hq-ai-results

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run chat reader (read-only)
        env:
          SITE_SESSIONS: ${{ secrets.SITE_SESSIONS }}
          SITE_SESSION_KARLANCER: ${{ secrets.SITE_SESSION_KARLANCER }}
          SITE_SESSION_PARSCODERS: ${{ secrets.SITE_SESSION_PARSCODERS }}
          SITE_SESSION_PONISHA: ${{ secrets.SITE_SESSION_PONISHA }}
          PYTHONPATH: .
        run: |
          python3 -m scripts.site_proposal.read_chat \
            --site "${{ inputs.site }}" \
            --project-url "${{ inputs.project_url }}" \
            --project-title "${{ inputs.project_title }}" \
            --job-id "${{ inputs.job_id }}" \
            --results-dir hq-ai-results

      - name: Commit and push results
        if: always()
        env:
          JOB_ID_INPUT: ${{ inputs.job_id }}
        run: |
          cd hq-ai-results
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d "jobs/$JOB_ID_INPUT" ] && git add "jobs/$JOB_ID_INPUT"
          if git diff --staged --quiet; then
            echo "No changes to commit in hq-ai-results."
            exit 0
          fi
          git commit -m "site-chat-read: job $JOB_ID_INPUT [skip ci]"
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i of $MAX_RETRIES..."
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Successfully pushed results to hq-ai-results."
              exit 0
            fi
            sleep $((i * 2))
          done
          echo "Failed to push results to hq-ai-results after $MAX_RETRIES attempts."
          exit 1
