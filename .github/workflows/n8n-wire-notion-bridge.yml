name: One-off -- wire the Notion event-driven bridge into n8n

# Manual, one-time setup. The owner set an n8n API key as a repo secret
# rather than pasting it into chat -- this workflow is the reason: it is
# the only place that key is ever dereferenced. See Tools/n8n_wire_notion_bridge.py
# for what each step actually does and why.
#
# Safe to re-run: credential/workflow lookup by name makes steps 1-2
# idempotent; step 3 checks for the marker before touching anything.

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step to run (all = every step in order)'
        required: false
        default: 'all'
        type: choice
        options: [all, credential, workflow, fix-marker, fix-guard, verify, recent-executions, execution-detail]
      exec_id:
        description: 'Execution id for the execution-detail step'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  wire:
    # MEASURED, not guessed: ubuntu-latest's first real run (35436778477)
    # hit a Cloudflare Managed Challenge (a JS challenge page, not n8n
    # itself) on https://n8n.airboxvip.top/api/v1/credentials -- a script
    # cannot solve that regardless of headers or retries. From an
    # unrelated sandbox IP the SAME two paths (a bare GET on /webhook/...
    # and an unauthenticated /api/v1/credentials) both answered with n8n's
    # own real responses (404, {"message":"Unauthorized"}), no challenge --
    # so this is runner-IP reputation, not a path rule. self-hosted runs on
    # infra this fleet already uses to reach this same host hourly (the
    # n8n webhook health check in Gate 2), which is why it is tried here --
    # not yet proven un-challenged itself, only more likely to be.
    #
    # SECOND RUN (35436880182), on self-hosted: Cloudflare error 1010
    # (browser_signature_banned) on POST /api/v1/credentials --
    # "The site owner has blocked access based on your browser's
    # signature. owner_action_required: true. Do not retry." This is a
    # TLS/HTTP client fingerprint block, not an IP block -- it will most
    # likely reject ANY script (curl, urllib, requests) from ANY runner,
    # self-hosted included, until the owner adds a Cloudflare exception
    # for this path or header. Deliberately not worked around by spoofing
    # a browser signature: Cloudflare's own response says not to retry,
    # and this may be an intentional anti-automation control on n8n's
    # management API specifically (as opposed to its /webhook/ paths,
    # which real automation traffic must reach and which answered
    # normally in the same test). Left for the owner to unblock, or for
    # the handful of remaining steps to be done by hand in n8n's UI
    # (already a real, working browser session, which this ban does not
    # affect) -- see Integrations/n8n/README.md.
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity/API for this repo -- back to GitHub-hosted until further notice
    timeout-minutes: 10
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      # The exact fallback notion-task-poller.yml already uses for issue
      # creation -- reused verbatim, not re-decided.
      GH_DISPATCH_PAT: ${{ secrets.AGY_ISSUE_PAT || secrets.ACC6_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight -- the secrets this job needs must be real
        env:
          STEP: ${{ inputs.step }}
        run: |
          set -e
          if [ -z "$N8N_API_KEY" ]; then
            echo "::error::secrets.N8N_API_KEY is empty or does not exist"
            exit 1
          fi
          if [ "$STEP" = "credential" ] || [ "$STEP" = "all" ]; then
            if [ -z "$GH_DISPATCH_PAT" ]; then
              echo "::error::neither secrets.AGY_ISSUE_PAT nor secrets.ACC6_PAT is set"
              exit 1
            fi
          fi
          echo "required secrets are present"

      - name: Diagnose -- what does THIS runner actually resolve and reach
        run: |
          echo "--- getent hosts ---"
          getent hosts n8n.airboxvip.top || true
          echo "--- cat /etc/hosts (grep) ---"
          grep -i airboxvip /etc/hosts || echo "no matching /etc/hosts entry"
          echo "--- resolv.conf ---"
          cat /etc/resolv.conf || true
          echo "--- curl -v (headers only, redacted key) ---"
          curl -sS -v -m 20 "https://n8n.airboxvip.top/api/v1/credentials" \
            -H "X-N8N-API-KEY: x" -o /tmp/body.json 2>&1 | \
            grep -Ev "^\* (SSL certificate verify|  CApath|  CAfile)" | head -60
          echo "--- response body ---"
          cat /tmp/body.json

      - name: Run the requested step(s)
        env:
          STEP: ${{ inputs.step }}
          EXEC_ID: ${{ inputs.exec_id }}
        run: |
          if [ -n "$EXEC_ID" ]; then
            python3 Tools/n8n_wire_notion_bridge.py --step "$STEP" --exec-id "$EXEC_ID"
          else
            python3 Tools/n8n_wire_notion_bridge.py --step "$STEP"
          fi
