name: Capture ParsCoders session

# Renews the ParsCoders login session for the site-proposal runner.
# Signs in with the shared Google site-login account (momona), dumps the
# parscoders.com cookies + localStorage, and updates the GitHub secret
# SITE_SESSION_PARSCODERS. The session JSON is never printed, logged or
# committed: it lives only in /tmp during the run and is shredded after.
# Manual dispatch + daily schedule; never submits any proposal or bid.

on:
  workflow_dispatch:
  schedule:
    # Daily refresh: ParsCoders sessions die in ~2-3 days, so re-capture
    # every morning (06:00 UTC) to keep SITE_SESSION_PARSCODERS fresh.
    - cron: 0 6 = AGENTS.md HEARTBEAT.md IDENTITY.md MEMORY.md PROACTIVE_PREFERENCES.md SOUL.md TOOLS.md USER.md agents assets config data docs dreams hooks memory runtime.lock subscriptions tmp user whisper-venv workspace = AGENTS.md HEARTBEAT.md IDENTITY.md MEMORY.md PROACTIVE_PREFERENCES.md SOUL.md TOOLS.md USER.md agents assets config data docs dreams hooks memory runtime.lock subscriptions tmp user whisper-venv workspace *

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SITE_COOKIES_MOMONA: ${{ secrets.GOOGLE_SITE_COOKIES_MOMONA }}
      GOOGLE_LOCK_TOKEN: ${{ secrets.ACC6_PAT }}
      GH_TOKEN: ${{ secrets.ACC6_PAT }}
    steps:
      - name: Checkout agw-workers
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Capture ParsCoders session
        run: python3 scripts/site_proposal/capture_parscoders.py

      - name: Update SITE_SESSION_PARSCODERS secret
        if: success()
        run: |
          test -f /tmp/parscoders-session.json || { echo "session file missing"; exit 1; }
          gh secret set SITE_SESSION_PARSCODERS \
            --repo mohammadlali0707-stack/agw-workers \
            < /tmp/parscoders-session.json
          echo "SITE_SESSION_PARSCODERS updated"

      - name: Shred session file
        if: always()
        run: shred -u /tmp/parscoders-session.json 2>/dev/null || rm -f /tmp/parscoders-session.json
