name: AGY Project Planning Bot -- Sonnet 4.6 (propose, then auto-dispatch after Notion HITL)

# Trailing @sonnet-plan (distinct from @sonnet and from @agy-plan). Same
# planner as agy-plan-bot.yml but pins Claude Sonnet 4.6 (Thinking), round-robins
# AGW_TOKEN_ACC0-ACC8 by this workflow's run_number, and on quota/rate-limit
# walks the next agy token instead of failing. Checkout, work, and comments
# stay in THIS repo (agw-workers). Do not redirect to Control-Room / CCP / etc.
# Lead dispatch after the proposal is unchanged (agy-plan-dispatch.yml).

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  actions: write
  contents: read

jobs:
  check-marker:
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity for this repo -- back to GitHub-hosted until further notice
    timeout-minutes: 5
    if: >
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@sonnet-plan') &&
        !contains(github.event.comment.body, '@sonnet-plan-approved') &&
        !contains(github.event.comment.body, '@agy-asset')) ||
      (github.event_name == 'issues' &&
        contains(github.event.issue.body, '@sonnet-plan') &&
        !contains(github.event.issue.body, '@sonnet-plan-approved') &&
        !contains(github.event.issue.body, '@agy-asset'))
    outputs:
      match: ${{ steps.check.outputs.match }}
      project_tag: ${{ steps.check.outputs.project_tag }}
      acc_index: ${{ steps.check.outputs.acc_index }}
    steps:
      - name: Check for a trailing @sonnet-plan marker and extract the project tag
        id: check
        env:
          BODY: ${{ github.event.comment.body || github.event.issue.body || '' }}
          TITLE: ${{ github.event.issue.title || '' }}
        run: |
          strip_footer() {
            python3 - "$1" <<'PYEOF'
          import re, sys
          text = sys.argv[1]
          lines = text.split("\n")
          pat = re.compile(
              r"^\s*(-{3,}|\*{3,}|_?Generated by \[[^\]]*\]\([^)]*\)_?|"
              r"<!--.*?-->|Co-Authored-By:.*|Claude-Session:.*|\s*)\s*$")
          while lines and pat.match(lines[-1]):
              lines.pop()
          sys.stdout.write("\n".join(lines))
          PYEOF
          }
          TRIMMED="$(printf '%s\n%s' "$TITLE" "$BODY" | sed -e 's/[[:space:]]*$//')"
          TRIMMED="$(strip_footer "$TRIMMED")"
          LOWER="$(printf '%s' "$TRIMMED" | tr '[:upper:]' '[:lower:]')"
          case "$LOWER" in
            *"@sonnet-plan")
              echo "match=true" >> "$GITHUB_OUTPUT"
              PROJECT=$(echo "$LOWER" | grep -oE '(ccp|cr|coffeenet|status)[[:space:]]+@sonnet-plan$' | awk '{print $1}')
              echo "project_tag=${PROJECT:-}" >> "$GITHUB_OUTPUT"
              ACC_IDX=$(( GITHUB_RUN_NUMBER % 9 ))
              echo "acc_index=$ACC_IDX" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "match=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  propose:
    needs: [check-marker]
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity for this repo -- back to GitHub-hosted until further notice
    timeout-minutes: 45
    if: >
      (github.event_name == 'issues' &&
        needs.check-marker.outputs.match == 'true' &&
        (github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'COLLABORATOR' ||
          github.event.issue.user.login == 'Mohammadlali')
      ) ||
      (github.event_name == 'issue_comment' &&
        needs.check-marker.outputs.match == 'true' &&
        github.event.comment.user.type != 'Bot' &&
        (github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'COLLABORATOR' ||
          github.event.comment.user.login == 'Mohammadlali')
      )
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACC6_PAT: ${{ secrets.ACC6_PAT }}
      PROJECT_TAG: ${{ needs.check-marker.outputs.project_tag }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      PRIMARY_IDX: ${{ needs.check-marker.outputs.acc_index }}
    steps:
      - uses: actions/checkout@v4

      - name: Set unique AGENT_REPO path
        run: |
          echo "AGENT_REPO=${RUNNER_TEMP}/agent-repo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-propose" >> "$GITHUB_ENV"

      - name: Stay in this repo (no Control-Room / CCP redirect)
        id: resolve
        run: |
          echo "target_repo=${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Post the work checklist before doing any of it
        env:
          CHECKLIST_MARKER: "<!-- agy-checklist:sonnet-plan-bot-${{ github.run_id }} -->"
          TARGET_REPO: ${{ steps.resolve.outputs.target_repo }}
          ACC_IDX: ${{ needs.check-marker.outputs.acc_index }}
        run: |
          echo "CHECKLIST_MARKER=${CHECKLIST_MARKER}" >> "$GITHUB_ENV"
          echo "CHECKLIST_ISSUE=${ISSUE_NUMBER}" >> "$GITHUB_ENV"
          echo "CHECKLIST_DONE=${RUNNER_TEMP}/plan_bot_done.txt" >> "$GITHUB_ENV"
          : > "${RUNNER_TEMP}/plan_bot_done.txt"
          printf '%s\t%s\t%s\n' \
            "plan-checkout" "خواندن مخزن هدف" "$TARGET_REPO" \
            "plan-thread" "خواندن کل گفتگوی این ایشو" "sonnet-planner" \
            "plan-draft" "تدوین پروپوزال با Sonnet 4.6" "agy-token-acc${ACC_IDX}" \
            "plan-post" "ارسال پروپوزال به‌عنوان کامنت" "sonnet-planner" \
            "plan-dispatch" "شروع اعزام لیدها بعد از تیک Plan" "sonnet-planner" \
            > /tmp/plan_bot_tasks.tsv
          python3 "$GITHUB_WORKSPACE/Tools/agy_checklist.py" post \
            --repo "$REPO" \
            --issue "$ISSUE_NUMBER" \
            --marker "$CHECKLIST_MARKER" \
            --title "Project Manager — نقشه Sonnet 4.6 در $TARGET_REPO (agy token ACC${ACC_IDX})" \
            --tasks /tmp/plan_bot_tasks.tsv

      - name: Checkout target repo
        env:
          TARGET_REPO: ${{ steps.resolve.outputs.target_repo }}
        run: |
          set -e
          if [ -z "$ACC6_PAT" ]; then
            echo "::error::ACC6_PAT not set -- cannot check out $TARGET_REPO"
            exit 1
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ACC6_PAT" | base64 -w0)"
          rm -rf "${AGENT_REPO}"
          mkdir -p "${AGENT_REPO}"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" clone \
            "{{https://github.com/${TARGET_REPO}}}.git" "${AGENT_REPO}"

      - name: Tick "plan-checkout"
        run: |
          python3 "$GITHUB_WORKSPACE/Tools/agy_checklist.py" tick \
            --repo "$REPO" \
            --issue "$CHECKLIST_ISSUE" \
            --marker "$CHECKLIST_MARKER" \
            --done-file "$CHECKLIST_DONE" --tag "plan-checkout" || true

      - name: Install AGY CLI from HF Dataset
        run: |
          curl -L \
            "https://huggingface.co/datasets/stranger777777/agw-cli-bin/resolve/main/cli_linux_x64.tar.gz" \
            -o /tmp/cli.tar.gz
          mkdir -p /tmp/agx
          tar -xzf /tmp/cli.tar.gz -C /tmp/agx
          CLI_BIN=$(find /tmp/agx -type f \( -name "antigravity" -o -name "agy" \) | head -1)
          if [ -z "$CLI_BIN" ]; then
            CLI_BIN=$(find /tmp/agx -type f -executable | head -1)
          fi
          AGY_BIN_DIR="${RUNNER_TEMP:-/tmp}/agy-bin"
          mkdir -p "$AGY_BIN_DIR"
          install -m 0755 "$CLI_BIN" "$AGY_BIN_DIR/agy"
          echo "$AGY_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$AGY_BIN_DIR:$PATH"
          agy --version 2>/dev/null || echo "agy ready"

      - name: Fetch the full issue thread for context (matters on a revision round)
        id: thread
        run: |
          gh issue view "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --json title,body,comments \
            --jq '"ISSUE: " + .title + "\n" + .body + "\n\n" + ([.comments[] | "--- COMMENT by " + .author.login + " ---\n" + .body] | join("\n\n"))' \
            > /tmp/thread.txt || echo "(could not fetch thread)" > /tmp/thread.txt

      - name: Tick "plan-thread"
        run: |
          python3 "$GITHUB_WORKSPACE/Tools/agy_checklist.py" tick \
            --repo "$REPO" \
            --issue "$CHECKLIST_ISSUE" \
            --marker "$CHECKLIST_MARKER" \
            --done-file "$CHECKLIST_DONE" --tag "plan-thread" || true

      - name: Build the planning prompt
        id: prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          TARGET_REPO: ${{ steps.resolve.outputs.target_repo }}
        run: |
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          SAFE_TITLE=$(printf '%s' "$ISSUE_TITLE" | tr -d '`\\$')
          SAFE_BODY=$(printf '%s' "$ISSUE_BODY" | sanitize)
          SAFE_COMMENT=$(printf '%s' "$COMMENT_BODY" | sanitize)
          GOAL="$SAFE_BODY"
          IS_REVISION=false
          if [ -n "$SAFE_COMMENT" ]; then GOAL="$SAFE_COMMENT"; IS_REVISION=true; fi
          {
            printf '%s\n' 'You are the Project Manager AI for this fleet. This is a PLANNING request only.'
            printf '%s\n' 'Do NOT write, edit, or commit any files. Do NOT perform any of the tasks yourself. Do NOT run any dispatch command. Only read and propose.'
            if [ "$IS_REVISION" = "true" ]; then
              printf '\n%s\n' 'This is a REVISION round. Below is the full conversation so far, including your own earlier proposal(s) and any leftover GitHub approval marker (ignore that marker, it is not addressed to you). Read it, understand what was already proposed and why the requester wants it changed (their newest message is the actual revision instruction), then produce a NEW, complete, corrected proposal -- not a diff or a partial patch to the old one.'
              printf '\n--- CONVERSATION SO FAR ---\n'
              cat /tmp/thread.txt | sanitize
              printf '\n--- END CONVERSATION ---\n'
            fi
            printf '\nGOAL / LATEST INSTRUCTION (may include a leading project tag and a trailing marker -- ignore both, they are routing metadata, not part of the goal):\n'
            printf '%s\n' "$GOAL"
            printf '\nDo this, in order:\n'
            printf '%s\n' '1. Read Team/org.json in this checked-out repo (if present) for the full member roster: each entry has id, account (ACC0-ACC8; ACC6 and ACC9 never appear here), role, guild, domain_is, title. If Team/org.json does not exist in this repo, say so plainly in your prose summary and propose a flat task list instead (no member_id/account fields) rather than inventing IDs.'
            printf '%s\n' '2. Read Team/MAP.md'"'"'s CURRENT STATE block (top of file) for what is already done, blocked, or in progress, so you do not propose duplicate or already-finished work.'
            printf '%s\n' '3. Read the repo'"'"'s README and the most recent entries of Team/CHANGELOG.md (if present) for scope and recent history.'
            printf '%s\n' '4. Break the GOAL into up to 8 ACCOUNT-LEVEL packages -- NOT per-member tasks. Team/org.json has an "accounts" map with entries ACC0..ACC8 (ACC6 and ACC9 never appear as work targets); each has a "lead" (its w01 member) plus a primary/secondary domain. For each account whose domain is actually relevant to this GOAL, write ONE package: a self-contained scope of work for that account'"'"'s TEAM (its lead plus 10 subordinates) to plan and execute on its own -- not individual task instructions. Skip an account entirely if this GOAL genuinely has no work for its domain; do not force all 8 to have a package.'
            printf '\n%s\n' '5. Output your ENTIRE response as exactly two parts, nothing else:'
            printf '%s\n' '   a) A short Persian paragraph (3-6 sentences) summarizing the plan in plain language, for a human to read.'
            printf '%s\n' '   b) Then ONE fenced code block, language json, containing ONLY valid JSON with exactly this shape (no comments, no trailing text inside the fence):'
            printf '%s\n' '{"kind":"tbs_account_plan","project_tag":"'"$PROJECT_TAG"'","target_repo":"'"$TARGET_REPO"'","goal":"<short restatement>","packages":[{"account":<int 0-8, never 6 or 9>,"package_goal":"<a full, self-contained scope of work for this account'"'"'s lead to break down further among its own 10 subordinates -- concrete enough to act on, not vague>"}]}'
            printf '%s\n' 'Do not include a trailing @agy, @agy-plan, @sonnet or @sonnet-plan marker anywhere in your response -- this response is a proposal, not a new request.'
          } > /tmp/prompt.txt
          echo "prompt_file=/tmp/prompt.txt" >> "$GITHUB_OUTPUT"

      - name: Run AGY in planning mode (Sonnet 4.6, round-robin + quota-walk ACC0-ACC8)
        id: run_agy
        env:
          MODEL_INPUT: "Claude Sonnet 4.6 (Thinking)"
        run: |
          set +e
          restore_token() {
            local idx="$1"
            mkdir -p ~/.gemini/antigravity-cli ~/.gemini/config
            local token_b64=""
            case "$idx" in
              0) token_b64="${{ secrets.AGW_TOKEN_ACC0 }}" ;;
              1) token_b64="${{ secrets.AGW_TOKEN_ACC1 }}" ;;
              2) token_b64="${{ secrets.AGW_TOKEN_ACC2 }}" ;;
              3) token_b64="${{ secrets.AGW_TOKEN_ACC3 }}" ;;
              4) token_b64="${{ secrets.AGW_TOKEN_ACC4 }}" ;;
              5) token_b64="${{ secrets.AGW_TOKEN_ACC5 }}" ;;
              6) token_b64="${{ secrets.AGW_TOKEN_ACC6 }}" ;;
              7) token_b64="${{ secrets.AGW_TOKEN_ACC7 }}" ;;
              8) token_b64="${{ secrets.AGW_TOKEN_ACC8 }}" ;;
            esac
            echo "$token_b64" | base64 -d > ~/.gemini/antigravity-cli/antigravity-oauth-token
            chmod 600 ~/.gemini/antigravity-cli/antigravity-oauth-token
            cat /proc/sys/kernel/random/uuid > ~/.gemini/antigravity-cli/installation_id
            echo '{"userSettings":{}}' > ~/.gemini/config/config.json
            echo "Restored acc${idx}: $(wc -c < ~/.gemini/antigravity-cli/antigravity-oauth-token) bytes"
          }
          is_quota_error() {
            grep -qiE 'too many requests|rate limit|rate-limit|429|quota' "$1"
          }
          cd "${AGENT_REPO}" 2>/dev/null || true
          PROMPT=$(cat /tmp/prompt.txt)
          USED_IDX="$PRIMARY_IDX"
          if [ -z "$USED_IDX" ]; then USED_IDX=$(( GITHUB_RUN_NUMBER % 9 )); fi
          restore_token "$USED_IDX"
          echo "Running agy --model $MODEL_INPUT with acc${USED_IDX}..."
          OUTPUT=$(timeout 1700 agy --model "$MODEL_INPUT" --dangerously-skip-permissions --print-timeout 1680s -p "$PROMPT" 2>&1)
          echo "$OUTPUT" > /tmp/agy_output.txt
          TRIED=1
          while is_quota_error /tmp/agy_output.txt && [ "$TRIED" -lt 9 ]; do
            NEXT_IDX=$(( (USED_IDX + 1) % 9 ))
            echo "::warning::acc${USED_IDX} hit a quota/rate-limit error, trying next identity acc${NEXT_IDX}"
            USED_IDX="$NEXT_IDX"
            restore_token "$USED_IDX"
            echo "Retrying with acc${USED_IDX}..."
            cd "${AGENT_REPO}" 2>/dev/null || true
            OUTPUT=$(timeout 1700 agy --model "$MODEL_INPUT" --dangerously-skip-permissions --print-timeout 1680s -p "$PROMPT" 2>&1)
            echo "$OUTPUT" > /tmp/agy_output.txt
            TRIED=$((TRIED + 1))
          done
          echo "used_idx=$USED_IDX" >> "$GITHUB_OUTPUT"
          echo "Output lines: $(wc -l < /tmp/agy_output.txt)"

      - name: Tick "plan-draft"
        run: |
          python3 "$GITHUB_WORKSPACE/Tools/agy_checklist.py" tick \
            --repo "$REPO" \
            --issue "$CHECKLIST_ISSUE" \
            --marker "$CHECKLIST_MARKER" \
            --done-file "$CHECKLIST_DONE" --tag "plan-draft" || true

      - name: Post the proposal as a comment
        run: |
          if [ ! -s /tmp/agy_output.txt ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$REPO" \
              --body "Project Manager: پروپوزال ساخته نشد (خروجی خالی). دوباره تلاش کنید."
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --body-file /tmp/agy_output.txt

      - name: Tick "plan-post"
        run: |
          python3 "$GITHUB_WORKSPACE/Tools/agy_checklist.py" tick \
            --repo "$REPO" \
            --issue "$CHECKLIST_ISSUE" \
            --marker "$CHECKLIST_MARKER" \
            --done-file "$CHECKLIST_DONE" --tag "plan-post" || true

      - name: Start lead dispatch (Notion Plan tick was HITL)
        id: auto_dispatch
        run: |
          if [ ! -s /tmp/agy_output.txt ]; then
            echo "empty proposal -- not dispatching"
            echo "started=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -q 'tbs_account_plan' /tmp/agy_output.txt; then
            echo "no tbs_account_plan in proposal -- not dispatching"
            echo "started=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --body "Project Manager: تیک Plan در Notion تأیید انسانی بود. اعزام لیدها الان شروع می‌شود."
          gh workflow run agy-plan-dispatch.yml \
            --repo "$REPO" \
            --field "issue_number=$ISSUE_NUMBER"
          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Tick "plan-dispatch"
        if: steps.auto_dispatch.outputs.started == 'true'
        run: |
          python3 "$GITHUB_WORKSPACE/Tools/agy_checklist.py" tick \
            --repo "$REPO" \
            --issue "$CHECKLIST_ISSUE" \
            --marker "$CHECKLIST_MARKER" \
            --done-file "$CHECKLIST_DONE" --tag "plan-dispatch" || true
