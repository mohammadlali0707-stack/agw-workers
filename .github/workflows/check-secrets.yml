name: Check Named Secrets Presence (no values)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report presence only -- never a value
        env:
          HAS_ACC0: ${{ secrets.ACC0_PAT != '' }}
        run: |
          echo "ACC0_PAT present: $HAS_ACC0"
