name: Check Named Secrets Presence (no values)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: self-hosted
    env:
      HAS_ACC0: ${{ secrets.ACC0_PAT != '' }}
      HAS_ACC1: ${{ secrets.ACC1_PAT != '' }}
      HAS_ACC2: ${{ secrets.ACC2_PAT != '' }}
      HAS_ACC3: ${{ secrets.ACC3_PAT != '' }}
      HAS_ACC4: ${{ secrets.ACC4_PAT != '' }}
      HAS_ACC5: ${{ secrets.ACC5_PAT != '' }}
      HAS_ACC6: ${{ secrets.ACC6_PAT != '' }}
      HAS_ACC7: ${{ secrets.ACC7_PAT != '' }}
      HAS_ACC8: ${{ secrets.ACC8_PAT != '' }}
      HAS_AGW0: ${{ secrets.AGW_TOKEN_ACC0 != '' }}
      HAS_AGW1: ${{ secrets.AGW_TOKEN_ACC1 != '' }}
      HAS_AGW2: ${{ secrets.AGW_TOKEN_ACC2 != '' }}
      HAS_AGW3: ${{ secrets.AGW_TOKEN_ACC3 != '' }}
      HAS_AGW4: ${{ secrets.AGW_TOKEN_ACC4 != '' }}
      HAS_AGW5: ${{ secrets.AGW_TOKEN_ACC5 != '' }}
      HAS_AGW6: ${{ secrets.AGW_TOKEN_ACC6 != '' }}
      HAS_AGW7: ${{ secrets.AGW_TOKEN_ACC7 != '' }}
      HAS_AGW8: ${{ secrets.AGW_TOKEN_ACC8 != '' }}
    steps:
      - name: Report presence only -- never a value
        run: |
          echo "ACC0_PAT present: $HAS_ACC0"
          echo "ACC1_PAT present: $HAS_ACC1"
          echo "ACC2_PAT present: $HAS_ACC2"
          echo "ACC3_PAT present: $HAS_ACC3"
          echo "ACC4_PAT present: $HAS_ACC4"
          echo "ACC5_PAT present: $HAS_ACC5"
          echo "ACC6_PAT present: $HAS_ACC6"
          echo "ACC7_PAT present: $HAS_ACC7"
          echo "ACC8_PAT present: $HAS_ACC8"
          echo "AGW_TOKEN_ACC0 present: $HAS_AGW0"
          echo "AGW_TOKEN_ACC1 present: $HAS_AGW1"
          echo "AGW_TOKEN_ACC2 present: $HAS_AGW2"
          echo "AGW_TOKEN_ACC3 present: $HAS_AGW3"
          echo "AGW_TOKEN_ACC4 present: $HAS_AGW4"
          echo "AGW_TOKEN_ACC5 present: $HAS_AGW5"
          echo "AGW_TOKEN_ACC6 present: $HAS_AGW6"
          echo "AGW_TOKEN_ACC7 present: $HAS_AGW7"
          echo "AGW_TOKEN_ACC8 present: $HAS_AGW8"
