name: AGW Claude

# Claude Code, driven from an issue or comment containing @claude.
# Mirrors Claud-Cloud-Project's tbs-claude.yml, trimmed for this repo:
# no branch pin (agw-workers works on main directly, actions/checkout
# defaults to it on an issues/issue_comment event), no game-specific
# allowedTools list. Excludes @media and @agy issues on purpose -- @media
# is handled by media-request-bot.yml (human-only) and @agy by
# agy-issue-bot.yml; without this exclusion an issue opened with both
# prefixes/mentions would fire two bots on the same branch at once.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: >
      contains(github.event.comment.body || github.event.issue.body, '@claude') &&
      !startsWith(github.event.issue.body, '@media') &&
      !startsWith(github.event.issue.body, '@agy') &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # One Claude per issue -- two running at once would both push to the
    # same branch and the second would deliver over the first.
    concurrency:
      group: agw-claude-${{ github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude, account 1
        id: c1
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true

      # Same reasoning as tbs-claude.yml: c1 dying mid-edit can leave the
      # working tree dirty and an issue-branch that collides with c2's own
      # (the action derives the branch name from issue number + minute).
      # Print status/diff before discarding so an abandoned edit is
      # findable in the log, then detach and drop any claude/issue-*
      # branch c1 made so c2 can create its own.
      - name: Clean working tree before failover
        id: clean_before_c2
        if: steps.c1.outcome == 'failure'
        continue-on-error: true
        run: |
          set +e
          echo "--- git status (c1's uncommitted work, about to be discarded) ---"
          git status
          echo "--- git diff --stat ---"
          git diff --stat
          git reset --hard HEAD
          git clean -fd
          echo "--- detach, then drop c1's issue branches so c2 can make its own ---"
          git checkout --force --detach HEAD
          BR=$(git for-each-ref --format='%(refname:short)' 'refs/heads/claude/issue-*')
          echo "branches to delete: ${BR:-<none>}"
          [ -n "$BR" ] && printf '%s\n' "$BR" | xargs -n1 git branch -D
          echo "--- local branches that remain ---"
          git branch

      - name: Claude, account 2
        id: c2
        if: steps.c1.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN2 }}
          show_full_output: true

      - name: Log c1/c2 outcomes
        if: always()
        run: echo "c1 outcome=${{ steps.c1.outcome }} c2 outcome=${{ steps.c2.outcome }}"
