name: One-off -- discover /opt/runner-api.py's real HTTP contract

# ROUND 2. Round 1 (run 35467908108) confirmed port 9876 is open and
# unauthenticated GET /health returns real JSON:
#   {"status": "ok", "version": "4", "fixes": ["per-repo-slot-manager",
#   "online-runner-check", "job-dedup", "blocking-pre-cleanup",
#   "process-age-limit-1h", "periodic-gc-15m", ...]}
# Every other port (8000, 8080, 5000, ...) hung until curl's own timeout
# instead of refusing -- a firewall dropping packets, not a closed port --
# so this round only targets 9876, with a short 3s timeout per request to
# stay fast, and tries likely FastAPI introspection endpoints first
# (openapi.json/docs/redoc) since /health's clean JSON shape and
# "version" field look exactly like a FastAPI app, which usually exposes
# its whole contract at /openapi.json unless deliberately disabled.
#
# Read-only reconnaissance. GET only.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      RUNNER_API_SECRET: ${{ secrets.RUNNER_API_SECRET }}
    steps:
      - name: Confirm both secrets are set
        run: |
          [ -n "$SERVER_IP" ] || { echo "::error::SERVER_IP not set"; exit 1; }
          [ -n "$RUNNER_API_SECRET" ] || { echo "::error::RUNNER_API_SECRET not set"; exit 1; }
          echo ok

      - name: Full /health body, then try to get the whole contract via FastAPI introspection
        run: |
          set +e
          echo "=== /health, full body ==="
          curl -sS --max-time 3 "http://${SERVER_IP}:9876/health"
          echo
          for p in /openapi.json /docs /redoc /api/openapi.json; do
            echo "=== $p ==="
            CODE=$(curl -sS -o /tmp/b.txt -w '%{http_code}' --max-time 3 "http://${SERVER_IP}:9876${p}")
            echo "HTTP $CODE"
            head -c 2000 /tmp/b.txt
            echo
          done

      - name: If no introspection endpoint worked, try likely REST paths unauthenticated (GET only, still just guessing shape not creating anything)
        run: |
          set +e
          for p in /runner /api/runner /register /api/register /slots /api/slots \
                   /repo /api/repo /repos /api/repos /jobs /api/jobs \
                   /metrics /version /info /api/health /provision /api/provision; do
            CODE=$(curl -sS -o /tmp/b.txt -w '%{http_code}' --max-time 3 "http://${SERVER_IP}:9876${p}")
            BODY=$(head -c 200 /tmp/b.txt)
            if [ "$CODE" != "404" ]; then
              echo "PATH=$p -> HTTP $CODE (NOT 404!): $BODY"
            else
              echo "PATH=$p -> 404"
            fi
          done

      - name: Try a few paths again with the secret as a bearer token and as X-API-Key (root plus likely write endpoints)
        run: |
          set +e
          for p in / /register /api/register /provision /api/provision; do
            echo "=== $p with Authorization: Bearer ==="
            CODE=$(curl -sS -o /tmp/b.txt -w '%{http_code}' --max-time 3 \
              -H "Authorization: Bearer ${RUNNER_API_SECRET}" "http://${SERVER_IP}:9876${p}")
            echo "HTTP $CODE: $(head -c 200 /tmp/b.txt)"
            echo "=== $p with X-API-Key ==="
            CODE=$(curl -sS -o /tmp/b.txt -w '%{http_code}' --max-time 3 \
              -H "X-API-Key: ${RUNNER_API_SECRET}" "http://${SERVER_IP}:9876${p}")
            echo "HTTP $CODE: $(head -c 200 /tmp/b.txt)"
          done
