name: TBS Godot 3D stage 1 build

on:
  workflow_dispatch:
  repository_dispatch:
    types: [notion-task]

permissions:
  contents: read

jobs:
  build-test-export:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.page_id == 'tbs-godot3d-stage1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.3-stable
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out private game repository
        uses: actions/checkout@v5
        with:
          repository: mohammadlali0707-stack/Claud-Cloud-Project
          token: ${{ secrets.ACC6_PAT }}
          ref: main
          fetch-depth: 0
          path: ccp

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build dependencies and verify Android build tools 34
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb ffmpeg unzip curl
          if [ ! -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" ]; then
            sdkmanager_bin=$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print -quit)
            test -x "$sdkmanager_bin"
            "$sdkmanager_bin" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"

      - name: Install Godot 4.3 and Android export templates
        shell: bash
        working-directory: ccp
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/$GODOT_VERSION"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 "$HOME/.local/bin/godot"
          cd "$HOME/.local/share/godot/export_templates/$GODOT_VERSION"
          python3 "$GITHUB_WORKSPACE/ccp/godot3d/tools/rzip.py" "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" version.txt android_debug.apk android_release.apk
          test -f android_debug.apk
          test -f android_release.apk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create debug keystore and Godot editor settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Fetch runtime assets and copy Persian font
        shell: bash
        working-directory: ccp/godot3d
        run: |
          set -euo pipefail
          chmod +x tools/fetch_assets.sh
          tools/fetch_assets.sh
          font=$(find ../game/fonts -type f -name 'Vazirmatn-Regular.ttf' -print -quit)
          test -n "$font"
          install -m 0644 "$font" fonts/Vazirmatn-Regular.ttf

      - name: Import project and run visual autotest under Xvfb
        shell: bash
        working-directory: ccp
        run: |
          set -euo pipefail
          timeout 180 godot --headless --editor --rendering-driver opengl3 --audio-driver Dummy --path godot3d --quit-after 120
          timeout 180 xvfb-run -a -s '-screen 0 1920x1080x24' godot --rendering-driver opengl3 --audio-driver Dummy --path godot3d -- --autotest 2>&1 | tee /tmp/godot-autotest.log
          test "$(find "$HOME/.local/share/godot/app_userdata" -type f -name '*.png' | wc -l)" -ge 6
          mkdir -p "$GITHUB_WORKSPACE/out/screenshots"
          find "$HOME/.local/share/godot/app_userdata" -type f -name '*.png' -exec cp '{}' "$GITHUB_WORKSPACE/out/screenshots/" ';'
          cp /tmp/godot-autotest.log "$GITHUB_WORKSPACE/out/"

      - name: Export debug APK
        shell: bash
        working-directory: ccp
        run: |
          set +e
          set -uo pipefail
          apk_path="$GITHUB_WORKSPACE/out/apk/TehranBlindSpot-3d-debug.apk"
          mkdir -p "$(dirname "$apk_path")"
          godot --headless --path godot3d --export-debug Android "$apk_path" 2>&1 | tee /tmp/godot-export.log
          rc=${PIPESTATUS[0]}
          set -e
          cp /tmp/godot-export.log "$GITHUB_WORKSPACE/out/"
          if [ "$rc" -ne 0 ] || [ ! -s "$apk_path" ]; then
            message=$(tail -80 /tmp/godot-export.log | tr '\n' ' ' | cut -c1-4000)
            printf '### Godot Android export diagnostic\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Godot Android export failed::See the run summary for the sanitized export log."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -name '*.apk' -print
            exit 1
          fi

      - name: Upload screenshots and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbs-godot3d-screenshots-${{ github.run_number }}
          path: |
            out/screenshots/
            out/godot-autotest.log
            out/godot-export.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tbs-godot3d-debug-apk-${{ github.run_number }}
          path: out/apk/*.apk
          if-no-files-found: error
          retention-days: 14
