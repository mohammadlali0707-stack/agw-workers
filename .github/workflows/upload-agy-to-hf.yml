name: "One-off: upload agy v1.2.14 to HuggingFace CLI bin dataset"

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  upload-to-hf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HF_TOKEN: ${{ secrets.AGW_HF_TOKEN }}
    steps:
      - name: Download agy v1.2.14 from GitHub Release
        run: |
          curl -fsSL \
            "https://huggingface.co/datasets/stranger777777/agw-cli-bin/resolve/main/cli_linux_x64.tar.gz" \
            -o /tmp/cli_linux_x64.tar.gz
          echo "Downloaded: $(wc -c < /tmp/cli_linux_x64.tar.gz) bytes"

      - name: Upload to HuggingFace via huggingface_hub
        run: |
          pip install huggingface_hub -q
          python3 - <<'PYEOF'
import os
from huggingface_hub import HfApi
api = HfApi(token=os.environ["HF_TOKEN"])
api.upload_file(
    path_or_fileobj="/tmp/cli_linux_x64.tar.gz",
    path_in_repo="cli_linux_x64.tar.gz",
    repo_id="stranger777777/agw-cli-bin",
    repo_type="dataset",
    commit_message="Update agy CLI to v1.2.14 (supports token auto-refresh)"
)
print("Upload complete!")
PYEOF

      - name: Verify version on HF
        run: |
          sleep 10
          curl -fsSL \
            "https://huggingface.co/datasets/stranger777777/agw-cli-bin/resolve/main/cli_linux_x64.tar.gz" \
            -o /tmp/hf_verify.tar.gz
          echo "HF file size: $(wc -c < /tmp/hf_verify.tar.gz) bytes"
          mkdir -p /tmp/hfv
          tar -xzf /tmp/hf_verify.tar.gz -C /tmp/hfv
          BIN=$(find /tmp/hfv -type f \( -name "agy" -o -name "antigravity" \) | head -1)
          [ -n "$BIN" ] && chmod +x "$BIN" && echo "HF binary version: $($BIN --version 2>/dev/null)"

      - name: Report result
        if: always()
        run: |
          gh issue comment 70 \
            --repo mohammadlali0707-stack/agw-workers \
            --body "**HF upload done:** agy v1.2.14 now at stranger777777/agw-cli-bin. GitHub Release can be deleted." \
            || echo "Could not post comment"
