name: Gate 1 -- YAML Lint & Workflow Validator

on:
  push:
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'
  pull_request:
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for CRLF line endings in workflow files
        run: |
          echo "=== Checking for CRLF line endings ==="
          CRLF_FILES=$(grep -rlU $'\r' .github/workflows/ 2>/dev/null || true)
          if [ -n "$CRLF_FILES" ]; then
            echo "❌ CRLF line endings found in:"
            echo "$CRLF_FILES"
            echo "Fix with: sed -i 's/\r//' <file>"
            exit 1
          fi
          echo "✅ No CRLF issues found"

      - name: Install yamllint + pyyaml
        run: pip3 install yamllint pyyaml --quiet || true

      - name: Lint all workflow YAML files
        run: |
          echo "=== Linting workflow YAML files ==="
          FAILED=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            echo -n "Checking $f ... "
            python3 -c "import yaml, sys; yaml.safe_load(open('$f'))" 2>&1
            if [ $? -ne 0 ]; then
              echo "❌ YAML syntax error in $f"
              FAILED=1
            else
              echo "✅"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi

      - name: Validate workflow structure (no empty jobs)
        run: |
          echo "=== Validating workflow structure ==="
          FAILED=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PYEOF'
          import sys, yaml
          f = sys.argv[1]
          data = yaml.safe_load(open(f))
          if not isinstance(data, dict):
              sys.exit(0)
          jobs = data.get('jobs', {})
          for jname, jbody in jobs.items():
              if not jbody or not jbody.get('steps'):
                  print(f"❌ {f}: job '{jname}' has no steps")
                  sys.exit(1)
          PYEOF
            if [ $? -ne 0 ]; then FAILED=1; fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi
          echo "✅ All workflow structures valid"

      # ── Ported from CR/Tools/check_workflow_safety.py ──────────────────────
      # CHECK-1: RETIRED -- replaced by Tools/check_run_injection.py (see below)
      # CHECK-2: python3 -c inline code at wrong indentation (causes name=path registration bug)
      # CHECK-3: YAML parse (redundant safety net with yamllint step above)
      - name: Workflow safety checks (CR ported)
        run: |
          echo "=== Workflow Safety Checks (ported from CR/Tools/check_workflow_safety.py) ==="
          python3 - <<'PYEOF'
          import sys, re, os, glob, yaml

          C_FAIL = "❌"
          C_OK   = "✅"
          _CHAR_CLASS_PATTERNS = ("tr -d", "tr -", "sed ", "| tr", "| sed")

          def check_1_double_quotes_in_printf(filepath, lines):
              """double-quotes inside single-quoted printf content strings → breaks agw-worker"""
              errors = []
              for i, raw_line in enumerate(lines, 1):
                  line = raw_line.strip()
                  if "printf" not in line:
                      continue
                  if any(p in line for p in _CHAR_CLASS_PATTERNS):
                      continue
                  if "$(printf" in line and "|" in line:
                      continue
                  sq_parts = re.findall(r"'([^']*)'", line)
                  for part in sq_parts[1:]:
                      if '"' in part:
                          errors.append((i, "[CHECK-1] double-quote in printf content string "
                                         "(will break agw-worker bash injection)", line[:100]))
              return errors

          def check_2_python_inline_yaml_indent(filepath, lines):
              """python3 -c at wrong indent → YAML block terminates early → name=path bug"""
              # The marker is ASSEMBLED, never written out, so this gate cannot
              # match its own source. It did: the guard below and the fix above
              # both contained the literal, and scanning this file reported 70
              # phantom findings against its own code.
              PY_C = "python3 " + "-c "
              errors = []
              for i, raw_line in enumerate(lines, 1):
                  line = raw_line.rstrip()
                  if PY_C + '"' not in line and PY_C + "'" not in line:
                      continue
                  py_cmd_indent = len(line) - len(line.lstrip())
                  # Only an UNCLOSED quote opens a continuation block. A command that
                  # closes its own quote on the same line opens nothing, and neither
                  # does a line where `python3 -c ` is just text (this gate mentions
                  # it in its own message string). Without this the scan never finds
                  # a closing quote, runs to EOF, and reports every later line that
                  # is less indented: 12 findings against `fi`/`done`/`sleep 15` in
                  # test-agy-chat-live.yml, and 70 more against this very file.
                  after = line.split(PY_C, 1)[-1]
                  quote = after[:1]
                  if quote not in ('"', "'") or quote in after[1:]:
                      continue
                  j = i
                  while j < len(lines):
                      next_raw = lines[j]
                      next_stripped = next_raw.strip()
                      if next_stripped in ('"', "'", '" 2>/dev/null', "' 2>/dev/null",
                                           '" 2>&1', "' 2>&1"):
                          break
                      if not next_stripped:
                          j += 1
                          continue
                      next_indent = len(next_raw) - len(next_raw.lstrip())
                      if next_indent < py_cmd_indent and next_stripped:
                          errors.append((j + 1,
                              f"[CHECK-2] python3 -c inline code at col {next_indent} "
                              f"(need >={py_cmd_indent} to stay in YAML block — causes name=path registration bug)",
                              next_stripped[:80]))
                      j += 1
              return errors

          def check_3_yaml_syntax(filepath, content):
              errors = []
              try:
                  yaml.safe_load(content)
              except yaml.YAMLError as e:
                  errors.append((0, "[CHECK-3] YAML parse error", str(e)[:160]))
              return errors

          def check_file(filepath):
              errors = []
              try:
                  with open(filepath, encoding="utf-8", errors="replace") as f:
                      content = f.read()
              except OSError as e:
                  return [(0, "cannot read file", str(e))]
              lines = content.splitlines()
              # CHECK-1 retired 2026-09-17. It forbade double quotes in printf
              # content as a PROXY for an untrusted expression being pasted
              # straight into a script body, which is what used to set PROMPT.
              # agw-worker.yml passes that through env: now, so the proxy only
              # fired on legitimate JSON templates. The real rule lives in
              # Tools/check_run_injection.py -- which, correctly, rejected an
              # earlier version of THIS comment for spelling the expression out
              # inside a run: body, where GitHub would have expanded it.
              errors += check_2_python_inline_yaml_indent(filepath, lines)
              errors += check_3_yaml_syntax(filepath, content)
              return errors

          files = sorted(
              glob.glob(".github/workflows/*.yml") +
              glob.glob(".github/workflows/*.yaml")
          )
          if not files:
              print(f"{C_OK} No workflow files found")
              sys.exit(0)

          all_errors = []
          for fp in files:
              for lineno, msg, snippet in check_file(fp):
                  loc = f"{fp}:{lineno}" if lineno else fp
                  all_errors.append(f"{loc}: {msg}\n        snippet: {snippet}")

          if all_errors:
              print(f"{C_FAIL} check_workflow_safety FAILED ({len(all_errors)} issue(s))")
              for e in all_errors:
                  print(f"  {C_FAIL} {e}")
              sys.exit(1)
          else:
              print(f"{C_OK} check_workflow_safety passed ({len(files)} files checked)")
          PYEOF

      # ── Ported from CR/Tools/check_heredoc_backticks.py ────────────────────
      # Unescaped backtick inside an unquoted heredoc → silent command substitution
      - name: Check for unescaped backticks in heredocs (CR ported)
        run: |
          echo "=== Heredoc Backtick Check (ported from CR/Tools/check_heredoc_backticks.py) ==="
          python3 - <<'PYEOF'
          import sys, re, glob

          # Unquoted heredoc delimiter patterns (expansion IS active → backtick is dangerous)
          _HEREDOC_START = re.compile(r'<<\s*([A-Za-z_][A-Za-z0-9_]*)\b')
          _HEREDOC_QUOTED = re.compile(r"<<\s*['\\\"]")

          def check_file(filepath):
              errors = []
              try:
                  with open(filepath, encoding="utf-8", errors="replace") as fh:
                      lines = fh.readlines()
              except OSError:
                  return errors

              in_heredoc = False
              delimiter = None
              for i, line in enumerate(lines, 1):
                  stripped = line.rstrip("\n")
                  if not in_heredoc:
                      # Check for unquoted heredoc start
                      if _HEREDOC_QUOTED.search(stripped):
                          continue  # quoted → safe, skip
                      m = _HEREDOC_START.search(stripped)
                      if m:
                          in_heredoc = True
                          delimiter = m.group(1)
                  else:
                      if stripped.strip() == delimiter:
                          in_heredoc = False
                          delimiter = None
                          continue
                      # Look for unescaped backtick
                      col = 0
                      s = stripped
                      while col < len(s):
                          if s[col] == '\\':
                              col += 2  # escaped — skip next char
                              continue
                          if s[col] == '`':
                              errors.append((i, stripped.strip()[:80]))
                              break
                          col += 1
              return errors

          files = sorted(
              glob.glob(".github/workflows/*.yml") +
              glob.glob(".github/workflows/*.yaml")
          )

          all_errors = []
          for fp in files:
              for lineno, snippet in check_file(fp):
                  all_errors.append(f"{fp}:{lineno}: unescaped backtick in unquoted heredoc\n        snippet: {snippet}")

          if all_errors:
              print(f"❌ check_heredoc_backticks FAILED ({len(all_errors)} issue(s))")
              for e in all_errors:
                  print(f"  ❌ {e}")
              sys.exit(1)
          else:
              print(f"✅ check_heredoc_backticks passed ({len(files)} files checked)")
          PYEOF

      # CHECK-4: a context used where GitHub evaluates it before any step runs.
      # Not a YAML error and not visible by reading -- the workflow simply never
      # starts, with zero jobs and no log. Shipped in four files on 2026-09-17
      # and survived three separate reviews. See Tools/check_job_env_contexts.py.
      - name: Job-level context availability
        run: python3 Tools/check_job_env_contexts.py .github/workflows

      # Replaces the retired CHECK-1. Flags an untrusted ${{ }} interpolated
      # into a run: body -- the injection vector itself rather than a proxy for
      # it. Ratcheted against Tools/injection_baseline.json: the 30 existing
      # locations are reported, only something NEW fails. A gate that goes red
      # on a backlog gets ignored, which is how CHECK-2 stopped protecting
      # anything.
      - name: No new untrusted expression in a run body
        run: python3 Tools/check_run_injection.py .github/workflows
