name: Deploy relay workflow to Mohammadlali/agw-workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/relay/deploy-request.txt'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACC0_PAT: ${{ secrets.ACC0_PAT }}
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Push relay workflow with ACC0_PAT
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, urllib.request, urllib.error
          tok = os.environ.get("ACC0_PAT", "")
          res = {"has_pat": bool(tok)}
          api = "https://api.github.com/repos/Mohammadlali/agw-workers/contents/.github/workflows/relay-plan-to-control.yml"
          hdr = {"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json"}
          def call(method, data=None):
              req = urllib.request.Request(api, data=json.dumps(data).encode() if data else None,
                                           headers=hdr, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  return e.code, {"error": e.read().decode(errors="replace")[:600]}
          if tok:
              st, cur = call("GET")
              body = {"message": "relay: forward @agy-plan/@sonnet plan markers to the control repo (plan bots only live there)",
                      "content": base64.b64encode(open(".github/relay/relay-plan-to-control.yml", "rb").read()).decode(),
                      "branch": "main"}
              if st == 200:
                  body["sha"] = cur["sha"]
              st2, out = call("PUT", body)
              res.update({"get": st, "put": st2, "commit": (out.get("commit") or {}).get("sha"),
                          "error": out.get("error")})
          print("::notice title=relay-deploy::" + json.dumps(res))
          os.makedirs(".github/relay", exist_ok=True)
          json.dump(res, open(".github/relay/deploy-result.json", "w"), indent=1)
          PYEOF

      - name: Save result
        if: always()
        run: |
          git config user.name "relay-deploy-bot"
          git config user.email "relay-deploy-bot@users.noreply.github.com"
          git add .github/relay/deploy-result.json || true
          git commit -m "relay: deploy result [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
