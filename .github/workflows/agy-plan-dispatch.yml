name: AGY Plan Dispatch (read the last tbs_account_plan, dispatch one lead per account)

# Triggered by a trailing @agy-plan-approved (Gemini) or @sonnet-plan-approved
# (Claude Sonnet 4.6) comment, or by workflow_dispatch from a combined tag
# (@agy-plan-agy / @agy-plan-sonnet / @sonnet-plan-agy / @sonnet-plan-sonnet).
# ALL workflow runs stay on this public repo (agw-workers) -- never on an
# account fork -- so Actions minutes are not consumed elsewhere. Each lead
# still uses that account's AGW_TOKEN_ACC* identity. Pass --field model=
# only when Sonnet execution is selected.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number whose most recent tbs_account_plan comment to dispatch'
        required: true
        type: string
      model:
        description: 'Empty = Gemini. Set to Claude Sonnet 4.6 (Thinking) for Sonnet execution.'
        required: false
        default: ''
        type: string

permissions:
  issues: write
  actions: write
  contents: read

jobs:
  check-marker:
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity for this repo -- back to GitHub-hosted until further notice
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '@agy-plan-approved') ||
      contains(github.event.comment.body, '@sonnet-plan-approved')
    outputs:
      match: ${{ steps.check.outputs.match }}
      model: ${{ steps.check.outputs.model }}
    steps:
      - name: Confirm trailing approved marker (or accept workflow_dispatch)
        id: check
        env:
          BODY: ${{ github.event.comment.body || '' }}
          TITLE: ${{ github.event.issue.title || '' }}
          EVENT_NAME: ${{ github.event_name }}
          MODEL_INPUT: ${{ github.event.inputs.model || '' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "model=${MODEL_INPUT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          strip_footer() {
            python3 - "$1" <<'PYEOF'
          import re, sys
          text = sys.argv[1]
          lines = text.split("\n")
          pat = re.compile(
              r"^\s*(-{3,}|\*{3,}|_?Generated by \[[^\]]*\]\([^)]*\)_?|"
              r"<!--.*?-->|Co-Authored-By:.*|Claude-Session:.*|\s*)\s*$")
          while lines and pat.match(lines[-1]):
              lines.pop()
          sys.stdout.write("\n".join(lines))
          PYEOF
          }
          TRIMMED="$(printf '%s\n%s' "$TITLE" "$BODY" | sed -e 's/[[:space:]]*$//')"
          TRIMMED="$(strip_footer "$TRIMMED")"
          LOWER="$(printf '%s' "$TRIMMED" | tr '[:upper:]' '[:lower:]')"
          case "$LOWER" in
            *"@sonnet-plan-approved")
              echo "match=true" >> "$GITHUB_OUTPUT"
              echo "model=Claude Sonnet 4.6 (Thinking)" >> "$GITHUB_OUTPUT"
              ;;
            *"@agy-plan-approved")
              echo "match=true" >> "$GITHUB_OUTPUT"
              echo "model=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "match=false" >> "$GITHUB_OUTPUT"
              echo "model=" >> "$GITHUB_OUTPUT"
              ;;
          esac

  parse-proposal:
    needs: [check-marker]
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity for this repo -- back to GitHub-hosted until further notice
    timeout-minutes: 5
    if: >
      needs.check-marker.outputs.match == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.comment.user.type != 'Bot' &&
          (github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'COLLABORATOR' ||
            github.event.comment.user.login == 'Mohammadlali')))
    outputs:
      target_repo: ${{ steps.parse.outputs.target_repo }}
      packages_json: ${{ steps.parse.outputs.packages_json }}
      accounts_csv: ${{ steps.parse.outputs.accounts_csv }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
      plan_fp: ${{ steps.parse.outputs.plan_fp }}
      model: ${{ needs.check-marker.outputs.model }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Find the most recent tbs_account_plan JSON in this issue's comments
        id: parse
        env:
          ISSUE_NUMBER_DISPATCH: ${{ github.event.inputs.issue_number || '' }}
          ISSUE_NUMBER_COMMENT: ${{ github.event.issue.number || '' }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="$ISSUE_NUMBER_DISPATCH"
          else
            ISSUE_NUMBER="$ISSUE_NUMBER_COMMENT"
          fi
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "::error::No issue number"
            exit 1
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          gh issue view "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --json comments \
            --jq '[.comments[].body] | reverse | .[]' \
            > /tmp/all_comments.txt
          python3 - <<'PYEOF'
          import json, os, re, hashlib, pathlib
          text = pathlib.Path('/tmp/all_comments.txt').read_text(encoding='utf-8')
          blocks = re.findall(r'```(?:json)?\s*(\{.*?\})\s*```', text, re.S)
          found = None
          for b in blocks:
              try:
                  obj = json.loads(b)
              except json.JSONDecodeError:
                  continue
              if obj.get('kind') == 'tbs_account_plan' and isinstance(obj.get('packages'), list):
                  found = obj
                  break
          if found is None:
              print('::error::No tbs_account_plan JSON found in this issue\'s comments')
              raise SystemExit(1)
          pkgs = []
          accounts = []
          for p in found['packages']:
              try:
                  acc = int(p['account'])
              except (KeyError, TypeError, ValueError):
                  continue
              if acc == 6 or acc == 9 or acc < 0 or acc > 8:
                  continue
              goal = str(p.get('package_goal') or '').strip()
              if not goal:
                  continue
              pkgs.append({'account': acc, 'package_goal': goal})
              if acc not in accounts:
                  accounts.append(acc)
          if not pkgs:
              print('::error::Proposal had no valid packages (accounts 0-8 except 6)')
              raise SystemExit(1)
          target = str(found.get('target_repo') or '').strip()
          if not target or '/' not in target:
              print('::error::Proposal missing target_repo')
              raise SystemExit(1)
          plan_fp = hashlib.sha1(
              '{}:{}:{}'.format(
                  os.environ.get('GITHUB_RUN_ID', ''),
                  os.environ.get('GITHUB_RUN_ATTEMPT', '1'),
                  target,
              ).encode()
          ).hexdigest()[:12]
          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a', encoding='utf-8') as f:
              f.write('target_repo={}\n'.format(target))
              f.write('packages_json={}\n'.format(json.dumps(pkgs, ensure_ascii=False)))
              f.write('accounts_csv={}\n'.format(','.join(str(a) for a in accounts)))
              f.write('plan_fp={}\n'.format(plan_fp))
          print('target_repo={} accounts={} packages={} plan_fp={}'.format(
              target, accounts, len(pkgs), plan_fp))
          PYEOF

      - name: Post a start marker on the issue
        env:
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
          ACCOUNTS: ${{ steps.parse.outputs.accounts_csv }}
          TARGET: ${{ steps.parse.outputs.target_repo }}
          PLAN_FP: ${{ steps.parse.outputs.plan_fp }}
          MODEL_INPUT: ${{ needs.check-marker.outputs.model }}
          REPO: ${{ github.repository }}
        run: |
          MODEL_LABEL="Gemini"
          if [ -n "$MODEL_INPUT" ]; then
            MODEL_LABEL="Sonnet 4.6"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "Project Manager: Lead dispatch started for accounts ${ACCOUNTS} on ${TARGET} (model=${MODEL_LABEL}, workflows on ${REPO}). [plan:${PLAN_FP}]"

  dispatch:
    needs: [parse-proposal]
    runs-on: ubuntu-latest  # self-hosted disabled, owner instruction 2026-09-19: runner-api.py fleet has no free capacity for this repo -- back to GitHub-hosted until further notice
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - account: 0
            owner: Mohammadlali
            agy_secret: AGW_TOKEN_ACC0
          - account: 1
            owner: momonakikugava-pixel
            agy_secret: AGW_TOKEN_ACC1
          - account: 2
            owner: lali94m-max
            agy_secret: AGW_TOKEN_ACC2
          - account: 3
            owner: ngocgminh5-debug
            agy_secret: AGW_TOKEN_ACC3
          - account: 4
            owner: hmmletssee7-design
            agy_secret: AGW_TOKEN_ACC4
          - account: 5
            owner: kidding602
            agy_secret: AGW_TOKEN_ACC5
          - account: 7
            owner: mohammad97okk
            agy_secret: AGW_TOKEN_ACC7
          - account: 8
            owner: moradzahra85-png
            agy_secret: AGW_TOKEN_ACC8
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AGY_TOKEN_B64: ${{ secrets[matrix.agy_secret] }}
      TARGET_REPO_PAT: ${{ secrets.ACC6_PAT }}
      CONTROL_REPO_PAT: ${{ secrets.ACC6_PAT }}
      PACKAGES_JSON: ${{ needs.parse-proposal.outputs.packages_json }}
      TARGET_REPO: ${{ needs.parse-proposal.outputs.target_repo }}
      ISSUE_NUMBER: ${{ needs.parse-proposal.outputs.issue_number }}
      PLAN_FP: ${{ needs.parse-proposal.outputs.plan_fp }}
      MODEL_INPUT: ${{ needs.parse-proposal.outputs.model }}
      ACCOUNTS_CSV: ${{ needs.parse-proposal.outputs.accounts_csv }}
      ACCOUNT: ${{ matrix.account }}
      DISPATCH_OWNER: ${{ matrix.owner }}
      CONTROL_REPO: ${{ github.repository }}
    steps:
      - name: Skip if this account has no package
        id: skip
        run: |
          HAS=$(python3 -c "import json,os; pkgs=json.loads(os.environ['PACKAGES_JSON']); print('yes' if any(p['account']==int(os.environ['ACCOUNT']) for p in pkgs) else 'no')")
          echo "has=$HAS" >> "$GITHUB_OUTPUT"
          GOAL=$(python3 -c "import json,os; pkgs=json.loads(os.environ['PACKAGES_JSON']); acc=int(os.environ['ACCOUNT']); print(next((p['package_goal'] for p in pkgs if p['account']==acc),''))")
          {
            echo "goal<<EOF"
            printf '%s\n' "$GOAL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch agy-lead-plan.yml on this public repo
        if: steps.skip.outputs.has == 'yes'
        env:
          PACKAGE_GOAL: ${{ steps.skip.outputs.goal }}
        run: |
          if [ -z "$AGY_TOKEN_B64" ]; then
            echo "::warning::No AGW_TOKEN for acc${ACCOUNT} (${DISPATCH_OWNER}) -- skipping"
            exit 0
          fi
          EXTRA=()
          if [ -n "$MODEL_INPUT" ]; then
            EXTRA+=(--field "model=$MODEL_INPUT")
          fi
          gh workflow run agy-lead-plan.yml \
            --repo "$CONTROL_REPO" \
            --field "account=${ACCOUNT}" \
            --field "package_goal=${PACKAGE_GOAL}" \
            --field "target_repo=${TARGET_REPO}" \
            --field "issue_number=${ISSUE_NUMBER}" \
            --field "plan_fp=${PLAN_FP}" \
            --field "all_accounts=${ACCOUNTS_CSV}" \
            --field "agy_token_b64=${AGY_TOKEN_B64}" \
            --field "target_repo_pat=${TARGET_REPO_PAT}" \
            --field "control_repo=${CONTROL_REPO}" \
            --field "control_repo_pat=${CONTROL_REPO_PAT}" \
            "${EXTRA[@]}" || {
              echo "::error::Failed to dispatch agy-lead-plan.yml on ${CONTROL_REPO} for acc${ACCOUNT}"
              exit 1
            }
          echo "Dispatched acc${ACCOUNT} lead on ${CONTROL_REPO} (agy identity ${DISPATCH_OWNER})"
