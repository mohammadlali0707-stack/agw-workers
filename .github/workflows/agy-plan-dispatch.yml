name: AGY Project Planning -- Lead Dispatch on Approval

# Triggered by a comment ending in "@agy-plan-approved" on an issue that
# carries a tbs_account_plan (posted by agy-plan-bot.yml). Parses the
# LATEST such proposal from the issue's own comment history and, for each
# account that has a package (0-8, never 6 or 9 -- ACC6 hosts this repo/
# Control-Room and is not a task-execution identity, ACC9 is retired),
# dispatches ONE agy-lead-plan.yml run for that account. Each lead then
# plans and dispatches its OWN 10 subordinates with the 5-second stagger
# (see agy-lead-plan.yml) -- this workflow only starts the 8 leads, all in
# parallel, since they are independent Antigravity identities/quotas and
# there is exactly one dispatch per account here (the stagger requirement
# is about calls sharing ONE identity, which leads vs. their own workers
# are, not leads vs. each other).
#
# Same trigger contract as agy-issue-bot.yml/agy-plan-bot.yml: a real bash
# check (GitHub Actions expressions have no escape sequences) and
# author_association OWNER/COLLABORATOR or login == Mohammadlali.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  actions: write
  contents: read

jobs:
  check-marker:
    runs-on: self-hosted
    if: always()
    outputs:
      match: ${{ steps.check.outputs.match }}
    steps:
      - name: Check for a trailing @agy-plan-approved marker
        id: check
        env:
          BODY: ${{ github.event.comment.body || '' }}
        run: |
          TRIMMED="$(printf '%s' "$BODY" | sed -e 's/[[:space:]]*$//')"
          LOWER="$(printf '%s' "$TRIMMED" | tr '[:upper:]' '[:lower:]')"
          case "$LOWER" in
            *"@agy-plan-approved") echo "match=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "match=false" >> "$GITHUB_OUTPUT" ;;
          esac

  parse-proposal:
    needs: [check-marker]
    runs-on: self-hosted
    if: >
      needs.check-marker.outputs.match == 'true' &&
      github.event.comment.user.type != 'Bot' &&
      (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.comment.user.login == 'Mohammadlali')
    outputs:
      skip: ${{ steps.parse.outputs.skip }}
      accounts: ${{ steps.parse.outputs.accounts }}
      proposal: ${{ steps.parse.outputs.proposal }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch comments, find the latest proposal, guard against a duplicate approval
        id: parse
        run: |
          set -e
          gh issue view "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --json comments --jq '.comments[].body' > /tmp/all_comments.txt

          if grep -q '^Project Manager: ðŸ Lead dispatch started' /tmp/all_comments.txt; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already dispatched once on this issue -- refusing to dispatch again."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Extract every fenced ```json block, keep the LAST one that
          # parses as a tbs_account_plan (the most recent revision wins).
          python3 - <<'PYEOF'
          import json, re, sys
          text = open('/tmp/all_comments.txt', encoding='utf-8').read()
          blocks = re.findall(r'```json\s*(.*?)```', text, re.DOTALL)
          proposal = None
          for b in blocks:
              try:
                  obj = json.loads(b)
              except Exception:
                  continue
              if obj.get('kind') == 'tbs_account_plan':
                  proposal = obj
          if proposal is None:
              print('NO_PROPOSAL_FOUND', file=sys.stderr)
              sys.exit(1)
          accounts = sorted({p.get('account') for p in proposal.get('packages', [])
                              if isinstance(p.get('account'), int) and p['account'] not in (6, 9) and p['account'] >= 0})
          with open('/tmp/proposal.json', 'w', encoding='utf-8') as f:
              json.dump(proposal, f)
          with open('/tmp/accounts.json', 'w', encoding='utf-8') as f:
              json.dump(accounts, f)
          print('parsed', len(proposal.get('packages', [])), 'package(s) across', len(accounts), 'accounts')
          PYEOF

          {
            echo "proposal<<PROPOSALEOF"
            cat /tmp/proposal.json
            echo ""
            echo "PROPOSALEOF"
          } >> "$GITHUB_OUTPUT"
          echo "accounts=$(cat /tmp/accounts.json)" >> "$GITHUB_OUTPUT"

      - name: Post start marker (also the duplicate-approval guard for next time)
        if: steps.parse.outputs.skip != 'true'
        run: |
          COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/proposal.json'))['packages']))")
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Project Manager: ðŸ Lead dispatch started -- ${COUNT} account package(s): ${{ steps.parse.outputs.accounts }}. Each lead will plan and dispatch its own 10 subordinates; a final ACC6 summary posts once all report back."

  dispatch:
    needs: [parse-proposal]
    if: >
      needs.parse-proposal.result == 'success' &&
      needs.parse-proposal.outputs.skip != 'true' &&
      needs.parse-proposal.outputs.accounts != '[]'
    runs-on: self-hosted
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJson(needs.parse-proposal.outputs.accounts) }}
    env:
      PROPOSAL_JSON: ${{ needs.parse-proposal.outputs.proposal }}
      ALL_ACCOUNTS: ${{ needs.parse-proposal.outputs.accounts }}
      ACC0_PAT: ${{ secrets.ACC0_PAT }}
      ACC1_PAT: ${{ secrets.ACC1_PAT }}
      ACC2_PAT: ${{ secrets.ACC2_PAT }}
      ACC3_PAT: ${{ secrets.ACC3_PAT }}
      ACC4_PAT: ${{ secrets.ACC4_PAT }}
      ACC5_PAT: ${{ secrets.ACC5_PAT }}
      ACC6_PAT: ${{ secrets.ACC6_PAT }}
      ACC7_PAT: ${{ secrets.ACC7_PAT }}
      ACC8_PAT: ${{ secrets.ACC8_PAT }}
      AGW_TOKEN_ACC0: ${{ secrets.AGW_TOKEN_ACC0 }}
      AGW_TOKEN_ACC1: ${{ secrets.AGW_TOKEN_ACC1 }}
      AGW_TOKEN_ACC2: ${{ secrets.AGW_TOKEN_ACC2 }}
      AGW_TOKEN_ACC3: ${{ secrets.AGW_TOKEN_ACC3 }}
      AGW_TOKEN_ACC4: ${{ secrets.AGW_TOKEN_ACC4 }}
      AGW_TOKEN_ACC5: ${{ secrets.AGW_TOKEN_ACC5 }}
      AGW_TOKEN_ACC7: ${{ secrets.AGW_TOKEN_ACC7 }}
      AGW_TOKEN_ACC8: ${{ secrets.AGW_TOKEN_ACC8 }}
    steps:
      # CROSS-ACCOUNT DISPATCH, fixed 2026-09-15: a lead for account N now
      # runs INSIDE that account's own copy of agw-workers (dispatched with
      # that account's own ACC{N}_PAT, the same relay pattern relay-open-
      # issue.yml/relay-deploy-file.yml already use), not inside this repo.
      # Before this fix every lead AND all of its subordinates ran here, in
      # mohammadlali0707-stack/agw-workers, piling 6-88 jobs onto ONE
      # account's Actions concurrency queue instead of spreading them across
      # up to 8 independent ones -- the owner caught this live (issue #13:
      # dozens of "Queued" AGW Worker runs, all in this one repo) by asking
      # directly why ACC6's own Actions tab was full when the design called
      # for each account's own. Confirmed by measurement, not assumed: a
      # relay-read-file.yml diagnostic showed Mohammadlali/agw-workers (ACC0)
      # is a real, independently-reachable repo with its own .github/
      # workflows/ -- account 0 was wrongly treated as a same-repo-only
      # exception earlier the same day; it needed the same fix as 1-8, not a
      # carve-out. Since the OTHER account's own repo has none of ACC6's
      # AGW_TOKEN_ACC*/ACC{n}_PAT secrets, this job resolves them HERE (where
      # they all exist) and passes the two the lead needs -- its own
      # Antigravity token and the PAT to push target_repo -- as
      # workflow_dispatch inputs, masked before use on the far side. agy-
      # lead-plan.yml and agw-worker.yml must already be deployed to that
      # account's repo (relay-deploy-file.yml) before this can find them.
      - name: Resolve this account's owner login and credentials
        id: resolve
        run: |
          set -e
          case "${{ matrix.account }}" in
            0) OWNER="Mohammadlali"; DISPATCH_PAT="$ACC0_PAT"; AGY_TOKEN="$AGW_TOKEN_ACC0" ;;
            1) OWNER="momonakikugava-pixel"; DISPATCH_PAT="$ACC1_PAT"; AGY_TOKEN="$AGW_TOKEN_ACC1" ;;
            2) OWNER="lali94m-max"; DISPATCH_PAT="$ACC2_PAT"; AGY_TOKEN="$AGW_TOKEN_ACC2" ;;
            3) OWNER="ngocgminh5-debug"; DISPATCH_PAT="$ACC3_PAT"; AGY_TOKEN="$AGW_TOKEN_ACC3" ;;
            4) OWNER="hmmletssee7-design"; DISPATCH_PAT="$ACC4_PAT"; AGY_TOKEN="$AGW_TOKEN_ACC4" ;;
            5) OWNER="kidding602"; DISPATCH_PAT="$ACC5_PAT"; AGY_TOKEN="$AGW_TOKEN_ACC5" ;;
            7) OWNER="mohammad97okk"; DISPATCH_PAT="$ACC7_PAT"; AGY_TOKEN="$AGW_TOKEN_ACC7" ;;
            8) OWNER="moradzahra85-png"; DISPATCH_PAT="$ACC8_PAT"; AGY_TOKEN="$AGW_TOKEN_ACC8" ;;
            *) echo "::error::account ${{ matrix.account }} has no cross-account owner (6 and 9 are never leads)"; exit 1 ;;
          esac
          if [ -z "$DISPATCH_PAT" ]; then
            echo "::error::no PAT for account ${{ matrix.account }} ($OWNER) -- cannot cross-dispatch"
            exit 1
          fi
          echo "::add-mask::$DISPATCH_PAT"
          echo "::add-mask::$AGY_TOKEN"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "dispatch_pat=$DISPATCH_PAT" >> "$GITHUB_OUTPUT"
          echo "agy_token=$AGY_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Dispatch this account's lead, in its OWN repo
        env:
          DISPATCH_OWNER: ${{ steps.resolve.outputs.owner }}
          GH_TOKEN: ${{ steps.resolve.outputs.dispatch_pat }}
          AGY_TOKEN: ${{ steps.resolve.outputs.agy_token }}
        run: |
          set -e
          echo "$PROPOSAL_JSON" > /tmp/proposal.json

          python3 - <<PYEOF
          import json
          p = json.load(open('/tmp/proposal.json'))
          pkg = next((x for x in p['packages'] if x.get('account') == ${{ matrix.account }}), None)
          if pkg is None:
              raise SystemExit('no package for account ${{ matrix.account }} -- should not happen, accounts list came from the same packages')
          with open('/tmp/package_goal.txt', 'w', encoding='utf-8') as f:
              f.write(pkg.get('package_goal', ''))
          with open('/tmp/target_repo.txt', 'w', encoding='utf-8') as f:
              f.write(p['target_repo'])
          PYEOF

          TARGET_REPO=$(cat /tmp/target_repo.txt)
          PACKAGE_GOAL=$(cat /tmp/package_goal.txt)

          # Same TARGET_REPO -> push-PAT mapping agw-worker.yml's own
          # "Checkout target repo" step uses locally -- resolved HERE
          # instead, since the lead's own repo won't have ACC6_PAT/ACC0_PAT
          # as local secrets, and handed over as target_repo_pat.
          case "$TARGET_REPO" in
            Mohammadlali/agw-workers) TARGET_REPO_PAT="$ACC0_PAT" ;;
            *) TARGET_REPO_PAT="$ACC6_PAT" ;;
          esac
          echo "::add-mask::$TARGET_REPO_PAT"

          echo "Dispatching lead for account ${{ matrix.account }} (${DISPATCH_OWNER}/agw-workers) against $TARGET_REPO"
          gh workflow run agy-lead-plan.yml \
            --repo "${DISPATCH_OWNER}/agw-workers" \
            --field "account=${{ matrix.account }}" \
            --field "package_goal=$PACKAGE_GOAL" \
            --field "target_repo=$TARGET_REPO" \
            --field "agy_token_b64=$AGY_TOKEN" \
            --field "target_repo_pat=$TARGET_REPO_PAT" \
            --field "control_repo_pat=$ACC6_PAT" \
            --field "issue_number=${{ github.event.issue.number }}" \
            --field "callback_id=plan-${{ github.event.issue.number }}-acc${{ matrix.account }}" \
            --field "all_accounts=$ALL_ACCOUNTS"
