name: AGY Final Report (ACC6, runs once all account leads have reported)

# Dispatched by whichever agy-lead-plan.yml run wins the race to see every
# account's team report present (Reports/agy/team_reports/acc<N>.md in
# target_repo). Runs AS ACC6's own identity -- this repo's own account,
# per the owner's spec ("یک بات در ACC6 تریگر شود") -- reads all of them,
# and posts ONE comprehensive Persian summary as a NEW issue on
# target_repo (not a comment), plus a link back on the original planning
# issue here.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'owner/repo the whole plan targeted'
        required: true
        type: string
      issue_number:
        description: 'The original agw-workers planning issue, to link back to'
        required: false
        default: ''
        type: string
      plan_fp:
        description: 'Fingerprint of the dispatch whose team reports this report covers. A report stamped with any other run is treated as stale. Empty falls back to matching on issue_number, which cannot tell two runs on the SAME issue apart.'
        required: false
        default: ''
        type: string
      all_accounts:
        description: 'JSON array of every account that had a package, e.g. [0,1,3]'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  final-report:
    runs-on: ${{ github.repository_owner == 'Mohammadlali' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      # Unique per job execution. /tmp/agent-repo was a single shared path:
      # it survived between jobs (which is why a `rm -rf` was added on
      # 2026-09-17), and `rm -rf` on a SHARED path is only safe when jobs run
      # one at a time. They do not -- agy-lead-plan dispatches 10 agw-worker
      # runs 5s apart, so two on one host would delete each other's checkout
      # mid-clone. That failure is silent, unlike the dir-exists error it
      # replaced. runner.temp is per-runner and the run/attempt/job triple
      # makes it unique even if the temp dir is ever shared.
      # AGENT_REPO is set by the first step below. The `runner` context is
      # NOT available in a job-level env: block -- only in step-level ones --
      # so `${{ runner.temp }}` here made GitHub reject the whole workflow at
      # startup: zero jobs, no log, the same signature as an unparseable file.
      # 74f136f shipped exactly that in four files; d99dbc0 fixed one of them.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_REPO: ${{ inputs.target_repo }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      PLAN_FP: ${{ inputs.plan_fp }}
      ALL_ACCOUNTS: ${{ inputs.all_accounts }}
    steps:
      - name: Set unique AGENT_REPO path
        run: |
          echo "AGENT_REPO=${RUNNER_TEMP}/agent-repo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-final-report" >> "$GITHUB_ENV"

      - name: Install AGY CLI from HF Dataset
        run: |
          curl -L \
            "https://huggingface.co/datasets/stranger777777/agw-cli-bin/resolve/main/cli_linux_x64.tar.gz" \
            -o /tmp/cli.tar.gz
          mkdir -p /tmp/agx
          tar -xzf /tmp/cli.tar.gz -C /tmp/agx
          CLI_BIN=$(find /tmp/agx -type f \( -name "antigravity" -o -name "agy" \) | head -1)
          if [ -z "$CLI_BIN" ]; then
            CLI_BIN=$(find /tmp/agx -type f -executable | head -1)
          fi
          # Install without sudo. Ephemeral runners are fresh containers and do
          # not inherit /etc/sudoers.d/runner from the Arvan host, so
          # `sudo install` dies with "sudo: a password is required" -- measured
          # 2026-09-17T09:58:21Z in job 105158016308, after the sudoers fix was
          # believed to be in place. A user-writable dir added to $GITHUB_PATH
          # needs no privilege and behaves identically on self-hosted and on
          # ubuntu-latest, so this no longer depends on the runner image.
          AGY_BIN_DIR="${RUNNER_TEMP:-/tmp}/agy-bin"
          mkdir -p "$AGY_BIN_DIR"
          install -m 0755 "$CLI_BIN" "$AGY_BIN_DIR/agy"
          # $GITHUB_PATH only affects LATER steps, so export for this one too.
          echo "$AGY_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$AGY_BIN_DIR:$PATH"
          agy --version 2>/dev/null || echo "agy ready"

      - name: Checkout target repo
        id: checkout_target
        env:
          ACC0_PAT: ${{ secrets.ACC0_PAT }}
          ACC6_PAT: ${{ secrets.ACC6_PAT }}
        run: |
          set -e
          case "$TARGET_REPO" in
            Mohammadlali/agw-workers) TOKEN="$ACC0_PAT" ;;
            *) TOKEN="$ACC6_PAT" ;;
          esac
          if [ -z "$TOKEN" ]; then
            echo "::error::No token wired for $TARGET_REPO"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          rm -rf "${AGENT_REPO}"
          mkdir -p "${AGENT_REPO}"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" clone \
            "https://github.com/${TARGET_REPO}.git" "${AGENT_REPO}"

      - name: Restore ACC6's own AGY identity
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.gemini/config
          echo "${{ secrets.AGW_TOKEN_ACC6 }}" | base64 -d > ~/.gemini/antigravity-cli/antigravity-oauth-token
          chmod 600 ~/.gemini/antigravity-cli/antigravity-oauth-token
          cat /proc/sys/kernel/random/uuid > ~/.gemini/antigravity-cli/installation_id
          echo '{"userSettings":{}}' > ~/.gemini/config/config.json

      - name: Build the final-summary prompt from every account's team report
        run: |
          cd "${AGENT_REPO}"
          python3 - <<'PYEOF'
          import json, os, re
          # A TEAM REPORT ON DISK IS NOT A TEAM REPORT FROM THIS RUN.
          # Measured on CCP-307 (issue #38, report Claud-Cloud-Project#44):
          # accounts 4, 5 and 8 produced nothing for that run, but their
          # acc<N>.md files from 2026-09-15 (issues #13/#14) were still there,
          # because the path is fixed and overwritten per run. This step tested
          # os.path.isfile and nothing else, so it fed three-day-old reports to
          # the summariser as current work -- which is how the fleet report came
          # to describe gui.rpy, screens.rpy and 31 GUI assets in detail while
          # the repository held zero .rpy files.
          # agy-lead-plan.yml now stamps each report with the run that wrote it.
          # An unstamped file predates that change and is treated as stale, not
          # as current: the safe direction, since every stale file seen so far
          # was unstamped.
          accounts = json.loads(os.environ['ALL_ACCOUNTS'])
          this_issue = os.environ.get('ISSUE_NUMBER', '').strip()
          # PREFER THE PLAN FINGERPRINT over the issue number. Keying on the
          # issue cannot separate two runs on the SAME issue, and CCP-307 and
          # CCP-308 were both #38 -- so the morning's team reports read as
          # fresh in the evening. The issue check stays as the fallback for a
          # lead dispatched by hand with no fingerprint.
          this_plan = os.environ.get('PLAN_FP', '').strip()
          stamp_re = re.compile(
              r'<!--\s*agy-team-report:\s*tag=(\S*)\s+issue=(\S*)'
              r'(?:\s+plan=(\S*))?\s+account=(\S*)\s+written=(\S*)\s*-->')
          parts, missing, stale = [], [], []
          for a in accounts:
              path = 'Reports/agy/team_reports/acc{}.md'.format(a)
              if not os.path.isfile(path):
                  missing.append(a)
                  continue
              with open(path, encoding='utf-8') as f:
                  body = f.read()
              m = stamp_re.search(body)
              if not m:
                  fresh = False
              elif this_plan:
                  fresh = (m.group(3) or '') == this_plan
              else:
                  fresh = this_issue != '' and m.group(2) == this_issue
              if fresh:
                  parts.append('--- Account {} ---\n{}'.format(a, body))
              else:
                  where = m.group(5) if m else 'no stamp'
                  stale.append('{} (issue {}, plan {}, written {})'.format(
                      a, m.group(2) if m else 'unknown',
                      (m.group(3) or 'none') if m else 'unknown', where))
          with open('/tmp/all_reports.txt', 'w', encoding='utf-8') as f:
              f.write('\n\n'.join(parts))
          with open('/tmp/missing.txt', 'w', encoding='utf-8') as f:
              f.write(','.join(str(m) for m in missing))
          with open('/tmp/stale.txt', 'w', encoding='utf-8') as f:
              f.write('; '.join(stale))
          print('fresh: {}, missing: {}, stale: {}'.format(
              len(parts), len(missing), len(stale)))
          PYEOF
          {
            printf '%s\n' 'You are the ACC6 fleet reviewer. Below are the team reports from every account that was dispatched work on this project.'
            printf '\n'
            cat /tmp/all_reports.txt
            MISSING=$(cat /tmp/missing.txt)
            if [ -n "$MISSING" ]; then
              printf '\n(Accounts with NO report on file, do not invent what they did: %s)\n' "$MISSING"
            fi
            STALE=$(cat /tmp/stale.txt 2>/dev/null)
            if [ -n "$STALE" ]; then
              printf '\n(Accounts whose ONLY team report belongs to an EARLIER run and was therefore NOT given to you: %s. They produced nothing this cycle. Report them as having produced nothing -- do not describe work from their old reports as if it happened now.)\n' "$STALE"
            fi
            printf '\nWrite ONE comprehensive Persian report covering: what was accomplished overall, account by account, anything that failed or is incomplete, and what should happen next. This is a final deliverable, not a proposal -- plain prose, no JSON.\n'
          } > /tmp/final_prompt.txt

      - name: Run AGY to write the final summary
        run: |
          set +e
          cd "${AGENT_REPO}"
          PROMPT=$(cat /tmp/final_prompt.txt)
          OUTPUT=$(timeout 1700 agy --dangerously-skip-permissions --print-timeout 1680s -p "$PROMPT" 2>&1)
          echo "$OUTPUT" > /tmp/final_report.txt

      - name: Post the final report as a new issue on target_repo
        id: post
        env:
          ACC6_PAT: ${{ secrets.ACC6_PAT }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          URL=$(GH_TOKEN="$ACC6_PAT" gh issue create \
            --repo "$TARGET_REPO" \
            --title "گزارش جامع دیسپچ -- ${DATE}" \
            --body-file /tmp/final_report.txt)
          echo "report_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Posted: $URL"

      - name: Link back on the original planning issue
        if: env.ISSUE_NUMBER != ''
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
            --body "Project Manager: ✅ همه‌ی اکانت‌ها گزارش دادند. گزارش جامع: ${{ steps.post.outputs.report_url }}"
